<script type="module">
import * as THREE from 'three';

// ============ ゲームログ（v6と同じ・常時ON。テストプレイは全部データ） ============
const LOG_TAG = new URLSearchParams(location.search).get('tag') || 'rikusen';
const STARTED = new Date().toISOString();
const LOG_KEY = 'yuujinGameLog_' + STARTED.replace(/[:.]/g, '-') + '_' + LOG_TAG;
const gameLog = [];
function logEvent(type, data) { gameLog.push({ t: Math.round(performance.now()), type, data }); }
function saveLog() {
  try {
    localStorage.setItem(LOG_KEY, JSON.stringify(
      { ver: location.pathname, tag: LOG_TAG, started: STARTED, events: gameLog.slice(-3000) }));
  } catch (e) { console.warn('⚠ ログを保存できなかった', e); }
}
window.saveLog = saveLog; window.gameLog = gameLog;
setInterval(saveLog, 10000);
addEventListener('beforeunload', saveLog);

// ============ ログの自動アップロード（v6と同じしくみ・tagで海戦と分かれる） ============
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyMDP1lVKD7YRe3A0Z37qr9W6fMOcIyPiy-c_d2kZs1ywQCeeBrwLz7sm6-5tKqYomX/exec';
const CLOUD_KEY = 'yuujin2026';
if (!localStorage.getItem('yuujinDevice')) {
  localStorage.setItem('yuujinDevice', 'pc-' + Math.random().toString(36).slice(2, 7));
}
const DEVICE = localStorage.getItem('yuujinDevice');
const UA = navigator.userAgent;
const TOUCH = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
const PLATFORM =
  /iPhone|Windows Phone|Android.+Mobile/i.test(UA) ? 'phone' :
  /iPad|Tablet/i.test(UA) || /Android/i.test(UA) ? 'tablet' :
  /Macintosh/i.test(UA) && TOUCH ? 'tablet' :
  TOUCH && Math.min(screen.width, screen.height) <= 820 ? 'phone' : 'pc';
if (!localStorage.getItem('yuujinWord')) {
  const B = ['ねこ', 'いぬ', 'くじら', 'さめ', 'かめ', 'たか', 'わし', 'ぺんぎん', 'らっこ', 'きつね'];
  localStorage.setItem('yuujinWord', B[Math.floor(Math.random()*B.length)] + (100 + Math.floor(Math.random()*900)));
}
const WORD = localStorage.getItem('yuujinWord');
document.getElementById('titleWord').textContent = WORD;
let sentCount = 0, sending = false;
function cloudBody(events) {
  return JSON.stringify({ key: CLOUD_KEY, runId: LOG_KEY, device: DEVICE, ver: location.pathname,
    tag: LOG_TAG, build: 'rikusen1', events });
}
async function sendLog() {
  if (sending || sentCount >= gameLog.length) return;
  sending = true;
  const upto = gameLog.length;
  try {
    const res = await fetch(CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: cloudBody(gameLog.slice(sentCount, upto)) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    sentCount = upto;
  } catch (e) { console.warn('⚠ ログを送れなかった。次の60秒でまた試す', e); }
  finally { sending = false; }
}
setInterval(sendLog, 60000);
addEventListener('beforeunload', () => {
  if (sentCount < gameLog.length) {
    try { navigator.sendBeacon(CLOUD_URL, cloudBody(gameLog.slice(sentCount))); } catch (e) {}
  }
});

// ============ 国（監督のリスト・8/25「日本軍とイギリス軍と…」の11か国そのまま） ============
const NATIONS = [
  { id: 'jp', name: '日本',     flag: '🇯🇵', color: 0xe60012 },
  { id: 'uk', name: 'イギリス', flag: '🇬🇧', color: 0x1d3c8f },
  { id: 'de', name: 'ドイツ',   flag: '🇩🇪', color: 0xffce00 },
  { id: 'in', name: 'インド',   flag: '🇮🇳', color: 0xff9933 },
  { id: 'ru', name: 'ロシア',   flag: '🇷🇺', color: 0x00a3dd },
  { id: 'fr', name: 'フランス', flag: '🇫🇷', color: 0x0055a4 },
  { id: 'it', name: 'イタリア', flag: '🇮🇹', color: 0x008c45 },
  { id: 'cn', name: '中国',     flag: '🇨🇳', color: 0xde2910 },
  { id: 'nl', name: 'オランダ', flag: '🇳🇱', color: 0xff6f00 },
  { id: 'pt', name: 'ポルトガル', flag: '🇵🇹', color: 0x046a38 },
  { id: 'es', name: 'スペイン', flag: '🇪🇸', color: 0xaa151b },
];

// ============ 兵科（監督の設計 8/25：共通＋差分。この書き方は監督のSMSの構造そのまま） ============
// 共通：なにかしらの銃・手榴弾・大砲1回・蘇生できる・HPじわじわ回復・しゃがみと走り
// ⚠ はしごとクラフト表は最小形では未実装（下のponytail）
const AI_RANGE = 110;   // AI兵が撃ちはじめる距離（弾は126mとどく）
// 服のわりあて（監督 9/5「ふくもつくってほしい」）。3種類を5兵科に配る
const OUTFIT = { rifle: 'coat', medic: 'pack', eng: 'pack', scout: 'camo', mg: 'coat' };
const CLASSES = [
  { id: 'rifle',  name: 'ライフル兵', icon: '🔫', speed: 7, hp: 100, dmg: 22, cd: 0.55, spread: 0.015,
    desc: 'とくべつな道具は無い。そのぶん 銃が一番強い', skill: 'none' },
  { id: 'medic',  name: '医療兵',     icon: '🩹', speed: 7, hp: 100, dmg: 10, cd: 0.4,  spread: 0.05,
    desc: '⭐で ほうたい＝近くのなかまと自分を回復。蘇生も2倍はやい', skill: 'heal' },
  { id: 'eng',    name: '工作兵',     icon: '🧱', speed: 6.5, hp: 110, dmg: 12, cd: 0.45, spread: 0.04,
    desc: '⭐で 砂袋（すなぶくろ）を置ける＝弾をふせぐ壁になる（10個まで）', skill: 'bag' },
  { id: 'scout',  name: '偵察兵',     icon: '🔭', speed: 9, hp: 85,  dmg: 16, cd: 0.5,  spread: 0.008,
    desc: '足がはやい。⭐で スコープ＝遠くが大きく見える', skill: 'scope' },
  { id: 'mg',     name: '機関兵',     icon: '🔥', speed: 6,  hp: 115, dmg: 8,  cd: 0.09, spread: 0.06,
    desc: '機関銃＝おしっぱなしで連射できる。そのかわり足がおそい', skill: 'none' },
];
// ponytail: はしご・クラフト表UI・服3種・迫撃砲は未実装, 監督が最小形で遊んで「次はどれ」と決めたら足す

// ============ 3D基本 ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e4);
scene.fog = new THREE.FogExp2(0x9cc4e4, 0.004);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.3, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('game').appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(80, 140, 60);
scene.add(sun, new THREE.AmbientLight(0xbcd4a0, 1.1));

// ============ 地形（監督8/25「ちけいは、たまに塹壕や坂がある木もある地面」） ============
// 高さは1つの関数 h(x,z) で決める。⚠ メッシュと歩行で別の計算をすると、足が地面にめり込む
// ⚠ 監督 9/5「敵の拠点が近すぎた」。前は360mしか離れておらず、走って20秒で横断できた。
//    520m に広げる（歩ける範囲は ±300 なので ±260 まで置ける）
const FORT_ALLY = { x: -260, z: 0 };
const FORT_FOE  = { x:  260, z: 0 };
function hillH(x, z) { return 2.2*Math.sin(x*0.015)*Math.cos(z*0.02) + 1.2*Math.sin(x*0.05+z*0.03); }
function trenchH(x, z) {
  // 塹壕（ざんごう）2本。z=±55 のあたりを東西に走る溝
  let d = 0;
  for (const tz of [-55, 55]) {
    if (Math.abs(x) < 150) {
      const g = Math.exp(-((z-tz)*(z-tz)) / (2*5.5*5.5));
      d -= 2.6 * g;
    }
  }
  return d;
}
function fortH(x, z) {
  // 要塞は台地（坂で登る）
  let up = 0;
  for (const f of [FORT_ALLY, FORT_FOE]) {
    const r = Math.hypot(x-f.x, z-f.z);
    if (r < 46) up = Math.max(up, 4.5 * Math.min(1, (46-r)/22));
  }
  return up;
}
const H = (x, z) => hillH(x, z) + trenchH(x, z) + fortH(x, z);

const groundGeo = new THREE.PlaneGeometry(620, 620, 130, 130);
groundGeo.rotateX(-Math.PI/2);
{
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, H(pos.getX(i), pos.getZ(i)));
  groundGeo.computeVertexNormals();
}
scene.add(new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x6b8f3e })));

// 木（幹＋葉）。要塞と塹壕をさけて置く
const rng = (() => { let s = 12345; return () => (s = (s*16807) % 2147483647) / 2147483647; })();  // 毎回おなじ配置（ログの再現に効く）
for (let i = 0; i < 46; i++) {
  const x = (rng()-0.5)*520, z = (rng()-0.5)*520;
  if (Math.hypot(x-FORT_ALLY.x, z) < 55 || Math.hypot(x-FORT_FOE.x, z) < 55) continue;
  if (Math.abs(Math.abs(z)-55) < 10 && Math.abs(x) < 150) continue;
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4, 6), new THREE.MeshLambertMaterial({ color: 0x6d4c2f }));
  trunk.position.y = 2;
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(2.6, 5.5, 7), new THREE.MeshLambertMaterial({ color: 0x2e6b2e }));
  leaf.position.y = 6;
  g.add(trunk, leaf);
  g.position.set(x, H(x, z), z);
  scene.add(g);
}
// 建物（監督8/30「建物がある」）。箱の家。中には入れない（最小形）
const houses = [];        // 通れないもの（建物・岩・要塞の壁）
const rocks = [];         // 監督 9/5「あと障害物もほしい」。かくれる場所をふやす
// 岩とコンクリの塊。⚠ 要塞の中と、要塞のあいだの道すじに 散らす＝進みながら隠れられる
function scatterRocks() {
  for (let i = 0; i < 34; i++) {
    const x = (Math.random()-0.5)*520, z = (Math.random()-0.5)*420;
    if (Math.hypot(x-(-260), z) < 26 || Math.hypot(x-260, z) < 26) continue;   // 要塞の中心はあける
    const w = 3 + Math.random()*5, h = 1.6 + Math.random()*2.6, d = 3 + Math.random()*5;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: Math.random() < 0.5 ? 0x7d7a6e : 0x8b8377 }));
    m.position.set(x, H(x, z) + h/2 - 0.2, z);
    m.rotation.y = Math.random()*Math.PI;
    scene.add(m);
    houses.push({ x, z, r: Math.max(w, d)*0.55 });
    rocks.push({ x, z });
  }
}
// 🪜 はしごと足場（監督 9/5「さすをつけたい はしご」）。
// ⚠ 見た目のメッシュと、立てる高さは 必ずこの2つの表から作る（v6の島で学んだ）
const PLATFORMS = [];     // 上に立てる四角（要塞の壁のてっぺん）
const LADDERS = [];       // のぼり坂。t=0が上（壁がわ）／t=1が下（地面がわ）
// そこに立ったときの足の高さ。地面か、足場か、はしごの坂か
function standH(x, z) {
  let h = H(x, z);
  for (const p of PLATFORMS)
    if (Math.abs(x - p.x) <= p.hx && Math.abs(z - p.z) <= p.hz) h = Math.max(h, p.y);
  for (const L of LADDERS) {
    const ax = L.x1 - L.x0, az = L.z1 - L.z0;
    const len2 = ax*ax + az*az;
    const t = ((x - L.x0)*ax + (z - L.z0)*az) / len2;
    if (t < 0 || t > 1) continue;
    if (Math.hypot(x - (L.x0 + ax*t), z - (L.z0 + az*t)) > L.hw) continue;
    h = Math.max(h, L.yTop + (L.yBot - L.yTop) * t);
  }
  return h;
}
for (const [hx, hz] of [[-60, -20], [-40, 90], [30, -95], [70, 40], [-120, 60], [120, -50]]) {
  const g = new THREE.Group();
  const w = 10 + rng()*6, d2 = 8 + rng()*5, ht = 6;
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, ht, d2), new THREE.MeshLambertMaterial({ color: 0x9b8465 }));
  body.position.y = ht/2;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d2)*0.72, 3.4, 4), new THREE.MeshLambertMaterial({ color: 0x7a3b2a }));
  roof.position.y = ht + 1.7; roof.rotation.y = Math.PI/4;
  g.add(body, roof);
  g.position.set(hx, H(hx, hz), hz);
  scene.add(g);
  houses.push({ x: hx, z: hz, r: Math.max(w, d2)*0.6 });   // 通れない（あたり判定）
}

// ============ 要塞と旗と常備柵 ============
const fortresses = [];
function makeFortress(f, side, color) {
  const g = new THREE.Group();
  const y = H(f.x, f.z);
  // 壁（四すみにブロック）
  const corners = [[-10,-10],[10,-10],[-10,10],[10,10]];
  for (let ci = 0; ci < corners.length; ci++) {
    const [dx, dz] = corners[ci];
    const wallM = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), new THREE.MeshLambertMaterial({ color: 0x8a8a80 }));
    wallM.position.set(dx, 2, dz);
    g.add(wallM);
    // ⚠ 壁は いままで すり抜けられた。はしごを意味あるものにするには、通れなくする必要がある。
    //    top を持たせて「もう上にのぼっている人は通す」＝はしごの先で詰まないようにする
    houses.push({ x: f.x + dx, z: f.z + dz, r: 3.2, top: y + 4 });
    PLATFORMS.push({ x: f.x + dx, z: f.z + dz, hx: 3, hz: 3, y: y + 4 });
    // 🪜 はしごは 外がわの2すみに掛ける（4すみ全部だと のぼり放題で 入口の意味が消える）
    if (ci % 2 === 0) {
      const sx = Math.sign(dx) || 1;
      const x0 = f.x + dx + sx*3, x1 = f.x + dx + sx*8.5, zz = f.z + dz;
      LADDERS.push({ x0, z0: zz, x1, z1: zz, hw: 1.5, yTop: y + 4, yBot: y });
      const lad = new THREE.Group();
      const rail = new THREE.MeshLambertMaterial({ color: 0x8d6a3f });
      for (const rz of [-1.2, 1.2]) {
        const r = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.22, 0.22), rail);
        r.position.set((x0 + x1)/2 - (f.x + dx), 2.1, zz - (f.z + dz) + rz);
        r.rotation.z = -sx * Math.atan2(4, 5.5);
        lad.add(r);
      }
      for (let k = 0; k <= 6; k++) {                       // だん（横木）
        const t = k/6;
        const step = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 2.6), rail);
        step.position.set(x0 + (x1-x0)*t - (f.x + dx), 4 + (0 - 4)*t + 0.12, zz - (f.z + dz));
        lad.add(step);
      }
      lad.position.set(dx, 0, dz);
      g.add(lad);
    }
  }
  // 旗（のっとりの目じるし）
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 12, 6), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
  pole.position.y = 6;
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide }));
  flag.position.set(2.5, 10, 0);
  g.add(pole, flag);
  g.position.set(f.x, y, f.z);
  scene.add(g);
  // 常備柵（監督8/29「常備柵は、当たるとダーメジを受ける」）。すきまが入口
  const fences = [];
  const R = 20;
  for (let i = 0; i < 14; i++) {
    const a = (i/14) * Math.PI*2;
    if (i % 7 === 3) continue;   // 入口（2か所あく）
    const fx = f.x + Math.cos(a)*R, fz = f.z + Math.sin(a)*R;
    const fence = new THREE.Mesh(new THREE.BoxGeometry(7, 1.6, 0.5),
      new THREE.MeshLambertMaterial({ color: 0x5a4632 }));
    fence.position.set(fx, H(fx, fz)+0.8, fz);
    fence.rotation.y = -a + Math.PI/2;
    scene.add(fence);
    fences.push({ x: fx, z: fz });
  }
  const F = { ...f, side, color, flag, capT: 0, fences, zone: 9 };
  fortresses.push(F);
  return F;
}

// ============ 兵士のモデル（カプセル＋頭。国の色） ============
// 服（監督 9/5）。⚠ 兵科ごとに かたちを変える＝画面で「だれが何の兵か」が見て分かる。
//    3種類：コート（長い上着）／背のう（リュック）／ヘルメットに草（偵察）
function addOutfit(g, kind, c, top) {
  const cloth = new THREE.MeshLambertMaterial({ color: c.clone().multiplyScalar(0.82) });
  if (kind === 'coat') {                       // 長い上着
    const coat = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.66, 1.05, 8), cloth);
    coat.position.y = 0.62; g.add(coat);
  } else if (kind === 'pack') {                // 背のう
    const pack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.62, 0.34), cloth);
    pack.position.set(0, 1.15, 0.5); g.add(pack);
    const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.62, 6), cloth);
    roll.rotation.z = Math.PI/2; roll.position.set(0, 1.5, 0.5); g.add(roll);
  } else if (kind === 'camo') {                // ヘルメットに草
    for (let i = 0; i < 5; i++) {
      const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.36, 0.07),
        new THREE.MeshLambertMaterial({ color: 0x4f6b32 }));
      const a = (i/5)*Math.PI*2;
      leaf.position.set(Math.cos(a)*0.3, top + 0.6, Math.sin(a)*0.3);
      leaf.rotation.z = Math.cos(a)*0.5; leaf.rotation.x = Math.sin(a)*0.5;
      g.add(leaf);
    }
  }
}
function makeSoldier(color, dark, isMe, outfit) {
  const g = new THREE.Group();
  const c = new THREE.Color(color);
  if (dark) c.multiplyScalar(0.55);   // 敵は同じ国の色でも 暗くする＝見分けがつく
  // ⚠ カプセルの高さは 中心 + 胴の半分 + 丸い先。ここを間違えると頭が体にうまる（最初そうなった）
  // ⚠ 下端 = CY - LEN/2 - R。ここを0にしないと体が地面から浮く（1.15だと0.15浮いていた）
  const R = 0.5, LEN = 1.0, CY = R + LEN/2;         // = 1.0 → 下端ちょうど0
  const top = CY + LEN/2 + R;                       // = 2.0
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(R, LEN, 3, 8), new THREE.MeshLambertMaterial({ color: c }));
  body.position.y = CY;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 10), new THREE.MeshLambertMaterial({ color: 0xe8c39e }));
  head.position.y = top + 0.30;                     // 首のぶん 上へ出す
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.40, 10, 7, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshLambertMaterial({ color: c }));
  helmet.position.y = top + 0.40;
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.5), new THREE.MeshLambertMaterial({ color: 0x2b2b2b }));
  gun.position.set(0.42, 1.35, -0.65);
  g.add(body, head, helmet, gun);
  if (outfit) addOutfit(g, outfit, c, top);   // 服（監督 9/5）
  // 足もとの影。⚠ パパ 9/5「身体との重なり方がおかしい。このゲーム影が出てる人いないから、
  //   いわゆる影の出方で、色だけこの色にすればいい」——これが正解だった。
  //   経過：頭上の白い輪→「死んだみたい」／足もとの輪を前面に描画→「ズレ感」。
  //   原因は depthTest を切って**体を貫通して手前に描いていた**こと＋
  //   ほかの兵に影が無いので、自分のしるしだけが浮いた異物に見えていたこと。
  // → **全員に影を出す**。自分のだけ色を変える。奥行きはふつうに扱う（体に隠れる）
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.8, 20),
    new THREE.MeshBasicMaterial({ color: isMe ? 0xffe066 : 0x101008,
      transparent: true, opacity: isMe ? 0.5 : 0.28, depthWrite: false }));
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.03;      // 地面とけんかしない ぎりぎりの高さ
  g.add(shadow);
  g.userData.shadow = shadow;
  return g;
}

// ============ HPバー（v6と同じ作り） ============
function attachHpBar(u, height) {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 10;
  const tex = new THREE.CanvasTexture(cv);
  // ⚠ depthTest を切ると、兵が丘や建物のうしろにいてもバーだけ宙に浮いて見える
  //    （パパ 9/5「レイヤーの上下が間違ったときみたく」と同じ症状）。ふつうに奥行きを見る
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: true, depthWrite: false }));
  sp.scale.set(1.1, 0.19, 1);  // ⚠ 大きいと画面が札だらけになる（3.2→1.9→1.1と詰めた）
  sp.position.y = height;
  u.group.add(sp);
  u.hpCv = cv; u.hpTex = tex; u.hpSprite = sp;
  updateHpBar(u);
}
function updateHpBar(u) {
  const c = u.hpCv.getContext('2d');
  c.clearRect(0, 0, 64, 10);
  c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0, 0, 64, 10);
  const pct = Math.max(0, u.hp / u.maxHp);
  c.fillStyle = pct > 0.5 ? '#66bb6a' : pct > 0.25 ? '#ffee58' : '#ef5350';
  c.fillRect(1, 1, 62*pct, 8);
  c.strokeStyle = u.faction === 'foe' ? '#ff5252' : '#69f0ae';
  c.strokeRect(0.5, 0.5, 63, 9);
  u.hpTex.needsUpdate = true;
}

let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function sfx(freq, dur, type = 'square', vol = 0.06) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

  // そうじ

  for (const f of fortresses) { /* 旗と柵は残す（作りなおさない） */ }

    fortresses[1].color = G.foeNation.color; fortresses[1].flag.material.color.set(G.foeNation.color); fortresses[1].side = 'foe'; fortresses[1].capT = 0;

  // 前を向く向き fwd は (-sin(yaw), 0, -cos(yaw))。敵要塞は +x にあるので yaw = -π/2。
  // ⚠ +π/2 にすると fwd が -x になり、「まえ」を押すと敵から遠ざかる（最初これで間違えた）
  player.yaw = -Math.PI/2;

        // 🚶 横にちらす＝一列に固まって突っこまない／押しと止まりの周期
        lane: (Math.random()-0.5)*90, pushT: Math.random()*2, pushing: Math.random() < 0.5 };
      attachHpBar(s, 3.1);

  };
  mkAI('ally', 8); mkAI('foe', 10);
  G.running = true;
  $('titleScreen').style.display = 'none';
  $('endScreen').style.display = 'none';

function explode(pos, big) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(big ? 5 : 1.4, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff6f00, transparent: true, opacity: 0.9 }));
  m.position.copy(pos); scene.add(m);
  explosions.push({ mesh: m, life: big ? 0.9 : 0.4 });
  playBoom();
}
function blastDamage(pos, r, dmg, owner) {
  // 爆発の範囲ダメージ（手榴弾・大砲）。自分にも当たる！（近すぎ注意）
  for (const s of soldiers) {
    if (s.state !== 'fight') continue;
    if (s.group.position.distanceTo(pos) < r) hitSoldier(s, dmg, owner);
  }
  if (owner !== 'me' && player.group && G.running) {
    if (player.group.position.distanceTo(pos) < r) hitPlayer(dmg);
  } else if (owner === 'me' && player.group.position.distanceTo(pos) < r*0.6) {
    hitPlayer(dmg*0.5);   // 自爆はちょっとだけ手かげん
  }
}
function hitSoldier(s, dmg, owner) {
  s.hp -= dmg; updateHpBar(s);
  if (s.hp <= 0 && s.state === 'fight') {
    s.state = 'down'; s.downT = 30;   // 監督ルール：倒れて30秒いないなら蘇生できる
    s.group.rotation.z = Math.PI/2 * (s.faction === 'foe' ? 1 : -1);
    logEvent('down', { faction: s.faction, by: owner });
    if (s.faction === 'foe') {
      if (owner === 'me') { G.kills++; $('killCt').textContent = 'たおした ' + G.kills; showMessage('🎯 敵をたおした！', 1.5); }
    } else showMessage('⚠ なかまが たおれた！ 近づくと 蘇生できる（30秒いない）', 3);
  }
}
function hitPlayer(dmg) {
  if (!G.running) return;
  G.hp -= dmg; G.hurtT = 0;
  if (G.hp <= 0) {
    explode(player.group.position.clone(), false);
    logEvent('player_down', {});
    showMessage('💥 たおれた！ じぶんの要塞から さいしゅつげき…', 3);
    respawn();
  }
}

// ============ メインループ ============
const fwd = new THREE.Vector3();
const tmpV = new THREE.Vector3();
let lastT = performance.now(), fireCd = 0, grenCd = 0, skillCd = 0, knifeCd = 0;

// ?dev=1 のときだけ、画面が裏でも ループを止めない（2画面テスト・自動テスト用）。
// ⚠ ふつうの遊びでは止めたまま（裏で電池を食わない）。
// ⚠ setTimeout は裏では毎秒1回に絞られるので、絞られない MessageChannel を使う。
//    これを知らずに測ると「動かない！」と実装を疑うことになる（海戦で何度も踏んだ）
const DEVMODE = new URLSearchParams(location.search).get('dev') === '1';
// ⚠ 版の印。監督がスマホで試して報告してくるので、**どの版を見ているか**が分からないと
//    直したはずの物を「まだ直ってない」と言われる（古いキャッシュを見ているだけ、が起きる）
const BUILD = 'riku-0906b';
{ const e = document.getElementById('buildTag'); if (e) e.textContent = '版:' + BUILD; }
const devPump = (() => {
  if (!DEVMODE) return null;
  const mc = new MessageChannel();
  let pending = null;
  mc.port1.onmessage = () => { const f = pending; pending = null; if (f) f(performance.now()); };
  return fn => { pending = fn; mc.port2.postMessage(0); };
})();
function nextFrame(fn) {
  if (devPump && document.hidden) devPump(fn);
  else requestAnimationFrame(fn);
}

function tick() {
  nextFrame(tick);
  const now = performance.now();
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;
  if (!G.running) { renderer.render(scene, camera); return; }
  const P = player.group.position;

  // ---- 移動（せんしゃ式：左右でむきをかえ、前後であるく。海戦とおなじ操作の芯） ----
  let sx = 0, sy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) sx = -1;
  if (keys['ArrowRight'] || keys['KeyD']) sx = 1;
  if (keys['ArrowUp'] || keys['KeyW']) sy = -1;
  if (keys['ArrowDown'] || keys['KeyS']) sy = 1;
  let run = keys['ShiftLeft'] || keys['ShiftRight'];
  if (stick.active) { sx = stick.x; sy = stick.y; run = Math.hypot(stick.x, stick.y) > 0.85; }  // 大きくたおすと はしる
  if (keys['KeyX'] && !G.crouchKey) { G.crouch = !G.crouch; logEvent('crouch', { on: G.crouch }); }
  G.crouchKey = keys['KeyX'];
  player.yaw -= sx * 2.2 * dt;
  fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  // ⚠ 監督 9/5「あと行動が早い」。歩き11m/sはボルト並み、走ると その1.5倍だった。
  //    兵科の speed を約0.64倍にし、走りも 1.6→1.5 にした
  let sp = G.cls.speed * (run ? 1.5 : 1) * (G.crouch ? 0.5 : 1);
  const nx = P.x - fwd.x * sy * sp * dt;
  const nz = P.z - fwd.z * sy * sp * dt;
  // 建物にはめり込まない
  let blocked = false;
  for (const hs of houses) {
    // ⚠ もう壁の上にのぼっている人は通す。ここが無いと、はしごを登った先で かべに阻まれて詰む
    if (hs.top !== undefined && P.y > hs.top - 1.6) continue;
    if (Math.hypot(nx-hs.x, nz-hs.z) < hs.r + 0.8) blocked = true;
  }
  if (!blocked && Math.abs(nx) < 300 && Math.abs(nz) < 300) { P.x = nx; P.z = nz; }
  // 🪜 足場とはしごのぶん、高さは standH で決める（地面だけを見ると 壁の上に立てない）
  const wantY = standH(P.x, P.z);
  P.y += (wantY - P.y) * Math.min(1, dt * 10);            // 段差はなめらかに
  if (Math.abs(wantY - P.y) < 0.05) P.y = wantY;
  player.group.rotation.y = player.yaw;
  player.group.scale.y = G.crouch ? 0.62 : 1;

  // ---- 常備柵：さわるとダメージ（監督8/29） ----
  for (const F of fortresses) for (const fe of F.fences) {
    if (Math.hypot(P.x-fe.x, P.z-fe.z) < 2.6) { hitPlayer(8*dt + 0); G.fenceHurt = (G.fenceHurt||0)+dt;
      if (G.fenceHurt > 0.5) { showMessage('⚠ 柵（さく）に さわると いたい！ 入口を さがせ', 1.5); G.fenceHurt = 0; } }
  }

  // ---- HPじわじわ回復（監督8/29「打たれても待ってるとじわじわ回復する」） ----
  G.hurtT += dt;
  if (G.hurtT > 4 && G.hp < G.maxHp) G.hp = Math.min(G.maxHp, G.hp + 4*dt);

  // ---- こうげき ----
  fireCd -= dt; grenCd -= dt; skillCd -= dt; knifeCd -= dt;
  // 🔪 さす（監督 9/5「ナイフだよあと全員」）。⚠ どの兵科でも使える。
  //    近いけど とどく範囲はせまい＝銃の代わりにはならない、近づけたときのごほうび
  if ((keys['KeyQ'] || knifePressed) && knifeCd <= 0) {
    knifeCd = 0.8;
    let hit = null, bestD = 3.0;
    for (const s2 of soldiers) {
      if (s2.faction !== 'foe' || s2.state === 'dead') continue;
      const q = s2.group.position;
      const d = Math.hypot(q.x-P.x, q.z-P.z);
      if (d > bestD) continue;
      // 前を向いている相手だけ（うしろは刺せない）
      const dot = (-Math.sin(player.yaw))*(q.x-P.x)/(d||1) + (-Math.cos(player.yaw))*(q.z-P.z)/(d||1);
      if (dot < 0.35) continue;
      bestD = d; hit = s2;
    }
    if (hit) { hitSoldier(hit, 70); showMessage('🔪 さした！', 1); logEvent('knife', { hit: true }); }
    else { showMessage('🔪 空ぶり…（もっと近づく）', 0.9); logEvent('knife', { hit: false }); }
  }
  const firing = keys['Space'] || firePressed;
  if (firing && fireCd <= 0) {
    fireCd = G.cls.cd;
    const spd = 90;
    const dir = fwd.clone();
    dir.x += (Math.random()-0.5) * G.cls.spread * (G.crouch ? 0.5 : 1) * 2;
    dir.y += (Math.random()-0.5) * G.cls.spread;
    shoot({ pos: P.clone().add(new THREE.Vector3(0, 1.6, 0)).addScaledVector(fwd, 1),
            vel: dir.multiplyScalar(spd), owner: 'me', dmg: G.cls.dmg });
    playGun();
    logEvent('fire', { cls: G.cls.id });
  }
  if ((keys['KeyB'] || grenPressed) && grenCd <= 0 && G.gren > 0) {
    grenCd = 30; G.gren--;   // 監督ルール 9/5：一回投げたら30秒つかえない
    shoot({ pos: P.clone().add(new THREE.Vector3(0, 1.8, 0)), vel: fwd.clone().multiplyScalar(16).add(new THREE.Vector3(0, 8, 0)),
            owner: 'me', dmg: 55, gravity: 18, blast: 6, life: 4, size: 0.3, color: 0x37474f });
    showMessage('💣 手榴弾！（のこり ' + G.gren + '・つぎまで30秒）', 1.6);
    logEvent('grenade', { left: G.gren });
  }
  if ((keys['KeyC'] || cannonPressed) && G.cannon > 0) {
    G.cannon = 0;
    shoot({ pos: P.clone().add(new THREE.Vector3(0, 2, 0)), vel: fwd.clone().multiplyScalar(38).add(new THREE.Vector3(0, 16, 0)),
            owner: 'me', dmg: 120, gravity: 20, blast: 13, life: 6, size: 0.7, color: 0x222222 });
    showMessage('💥💥 大砲 発射！！（1人1回だけ）', 2.5);
    logEvent('cannon', {});
    playBoom();
  }
  // ---- とくぎ（E）：兵科ごと ----
  if ((keys['KeyE'] || skillPressed) && skillCd <= 0) {
    if (G.cls.skill === 'heal') {
      skillCd = 5;
      G.hp = Math.min(G.maxHp, G.hp + 30);
      let healed = 0;
      for (const s of soldiers) {
        if (s.faction === 'ally' && s.state === 'fight' && s.group.position.distanceTo(P) < 8) {
          s.hp = Math.min(s.maxHp, s.hp + 40); updateHpBar(s); healed++;
        }
      }
      showMessage('🩹 ほうたい！ じぶん＋なかま' + healed + '人 かいふく', 2);
      logEvent('heal', { healed });
    } else if (G.cls.skill === 'bag') {
      skillCd = 1.2;
      if (sandbags.length >= 10) { showMessage('🧱 砂袋は 10個まで！', 1.5); }
      else {
        const bx = P.x - fwd.x*2.5, bz = P.z - fwd.z*2.5;
        const m = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.3, 1),
          new THREE.MeshLambertMaterial({ color: 0xb59a6a }));
        m.position.set(bx, H(bx, bz)+0.65, bz);
        m.rotation.y = player.yaw;
        scene.add(m);
        sandbags.push({ mesh: m, x: bx, z: bz });
        showMessage('🧱 砂袋を置いた（' + sandbags.length + '/10）弾をふせぐぞ', 1.5);
        logEvent('place_bag', { n: sandbags.length });
      }
    } else if (G.cls.skill === 'scope') {
      skillCd = 0.5;
      G.scope = !G.scope;
      camera.fov = G.scope ? 28 : 70; camera.updateProjectionMatrix();
      showMessage(G.scope ? '🔭 スコープON（もう一回で もどる）' : '🔭 スコープOFF', 1.2);
      logEvent('scope', { on: G.scope });
    }
  }
  // じぶんの要塞で ほきゅう
  if (Math.hypot(P.x-FORT_ALLY.x, P.z-FORT_ALLY.z) < 14) {
    if (G.gren < 3) { G.gren = 3; showMessage('💣 手榴弾を ほきゅうした！', 1.5); }
  }

  // ---- 蘇生（監督ルール：みんな蘇生できる・倒れて30秒いない） ----
  let revTarget = null;
  for (const s of soldiers) {
    if (s.state !== 'down') continue;
    s.downT -= dt;
    if (s.downT <= 0) {   // 30秒すぎた…
      s.state = 'dead'; s.deadT = 20;
      scene.remove(s.group);
      continue;
    }
    if (s.faction === 'ally' && s.group.position.distanceTo(P) < 4) revTarget = s;
  }
  // 🩹 監督 9/5「蘇生近ずくと蘇生っていうボタンがほしい」。
  // ⚠ 前は 近づくだけで 勝手に蘇生が進んでいた。近くに来たらボタンを出し、押している間だけ進む
  $('reviveBtn').style.display = revTarget ? 'flex' : 'none';
  if (revTarget) $('reviveBtn').classList.add('on'); else $('reviveBtn').classList.remove('on');
  if (revTarget && (revivePressed || keys['KeyE'])) {
    const need = G.cls.skill === 'heal' ? 1.5 : 3;   // 医療兵は2倍はやい
    revTarget.revT += dt;
    $('stateRow').textContent = '🩹 蘇生中… ' + Math.ceil(need - revTarget.revT) + '（おしつづけて！）';
    if (revTarget.revT >= need) {
      revTarget.state = 'fight'; revTarget.hp = revTarget.maxHp * 0.5; revTarget.revT = 0;
      revTarget.group.rotation.z = 0;
      updateHpBar(revTarget);
      showMessage('✨ なかまを 蘇生した！！', 2.5);
      logEvent('revive', {});
    }
  } else if (revTarget) {
    $('stateRow').textContent = '🩹 なかまが たおれてる！ 🩹そせい を おす（キーは E）';
  } else {
    for (const s of soldiers) if (s.state === 'down') s.revT = 0;
    $('stateRow').textContent = G.crouch ? '🧎 しゃがみ中（ねらわれにくい）' : '';
  }
  // しんだ兵は、しばらくすると 要塞から わいてくる（戦いがつづくように）
  for (const s of soldiers) {
    if (s.state !== 'dead') continue;
    s.deadT -= dt;
    if (s.deadT <= 0) {
      const home = s.faction === 'ally' ? FORT_ALLY : FORT_FOE;
      s.group.position.set(home.x + (Math.random()-0.5)*20, 0, home.z + (Math.random()-0.5)*20);
      s.group.position.y = H(s.group.position.x, s.group.position.z);
      s.group.rotation.z = 0;
      s.hp = s.maxHp; s.state = 'fight';
      updateHpBar(s);
      scene.add(s.group);
    }
  }

  // ---- AI兵 ----
  // ⚠ 監督報告 9/5「敵が前をとおってもうたなかっか」（3回）。原因は射程だった。
  //    弾は 秒速70m × 1.8秒 ＝ 126m とどくのに、AIは 55m まで近づかないと撃たなかった。
  //    ＝目の前を素通りする兵ができる。武器のとどく手前（110m）まで引き上げる

  for (const s of soldiers) {
    if (s.state !== 'fight') continue;
    const sp2 = s.group.position;
    // ねらう相手：敵側→自分か味方AI／味方側→敵AI
    let tgt = null, best = 1e9;
    const foes = s.faction === 'ally'
      ? soldiers.filter(o => o.faction === 'foe' && o.state === 'fight')
      : soldiers.filter(o => o.faction === 'ally' && o.state === 'fight');
    for (const o of foes) {
      const d = o.group.position.distanceTo(sp2);
      if (d < best) { best = d; tgt = o.group.position; }
    }
    if (s.faction === 'foe') {
      const dp = P.distanceTo(sp2);
      if (dp < best) { best = dp; tgt = P; }
    }
    // 目的地：のっとり係は相手の要塞へ／戦う係は敵のいるほうへ。
    // ⚠ lane で横にずらす＝全員が同じ一点に集まって 一列で突っこむのを防ぐ
    const base = s.mission === 'capture'
      ? (s.faction === 'ally' ? FORT_FOE : FORT_ALLY)
      : (tgt ? { x: tgt.x, z: tgt.z } : (s.faction === 'ally' ? FORT_FOE : FORT_ALLY));
    const goal = { x: base.x, z: base.z + (s.mission === 'capture' ? s.lane : 0) };
    const gd = Math.hypot(goal.x-sp2.x, goal.z-sp2.z);
    // ⚠ 監督 9/5「あと味方が突進するの面白くない」。
    //    いままでは **撃ちながら ずっと真っすぐ歩いていた**＝突撃にしか見えない。
    //    敵が射程に入ったら **止まって撃つ**。ときどきだけ前へ出る（押す→止まる→撃つ）
    s.pushT -= dt;
    if (s.pushT <= 0) {
      s.pushing = !s.pushing;
      s.pushT = s.pushing ? (1.0 + Math.random()*1.4) : (2.2 + Math.random()*2.6);
    }
    const engaged = tgt && best < AI_RANGE;
    if ((!engaged || s.pushing) && gd > (s.mission === 'capture' ? 6 : 22)) {
      const dx = (goal.x-sp2.x)/gd, dz = (goal.z-sp2.z)/gd;
      sp2.x += dx * 6.5 * dt; sp2.z += dz * 6.5 * dt;
      sp2.y = H(sp2.x, sp2.z);
      s.group.rotation.y = Math.atan2(dx, dz) + Math.PI;
    }
    // 💣 監督 9/5「あと敵も手榴弾も投げてほしい」。
    // ⚠ 近すぎると自分も巻きこむ。遠すぎると届かない＝20〜55mのときだけ投げる。
    //    人にも30秒の待ちがあるので、AIも同じくらい間をあける（片方だけ連発だと不公平）
    s.grenT = (s.grenT === undefined) ? 8 + Math.random()*20 : s.grenT - dt;
    if (s.grenT <= 0) {
      if (!(tgt && best > 20 && best < 55)) {
        s.grenT = 2;            // 距離が合わない＝すぐ見なおす（長く待つと ほとんど投げない）
      } else {
        s.grenT = 22 + Math.random()*20;
        const gv = tmpV.set(tgt.x - sp2.x, 0, tgt.z - sp2.z);
        const flat = gv.length() || 1;
        gv.normalize().multiplyScalar(flat * 0.62);        // 山なりに とどく速さ
        gv.y = 9;
        shoot({ pos: sp2.clone().add(new THREE.Vector3(0, 1.8, 0)), vel: gv,
                owner: s.faction, dmg: 45, gravity: 18, blast: 6, life: 4, size: 0.3, color: 0x37474f });
        logEvent('ai_grenade', { faction: s.faction });
      }
    }
    // うつ
    s.cd -= dt;
    if (tgt && best < AI_RANGE && s.cd <= 0) {
      s.cd = 1.2 + Math.random()*0.8;
      const dir = tmpV.set(tgt.x-sp2.x, 1.4 + (tgt===P ? (G.crouch ? 0.2 : 0.5) : 0.5) - 1.5, tgt.z-sp2.z).normalize();
      // しゃがんでいる自分は ねらいがズレやすい（＝しゃがみの意味）
      const miss = (tgt === P && G.crouch) ? 0.14 : 0.06;
      dir.x += (Math.random()-0.5)*miss; dir.y += (Math.random()-0.5)*miss; dir.z += (Math.random()-0.5)*miss;
      shoot({ pos: sp2.clone().add(new THREE.Vector3(0, 1.6, 0)), vel: dir.multiplyScalar(70),
              owner: s.faction, dmg: 9, color: s.faction === 'foe' ? 0xff5252 : 0xfff176 });
    }
  }

  // ---- 弾 ----
  for (let i = projs.length-1; i >= 0; i--) {
    const p = projs[i];
    p.vel.y -= p.gravity * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.life -= dt;
    let done = false;
    const pp = p.mesh.position;
    // 砂袋が弾をふせぐ（工作兵のとくぎの意味）
    for (const b of sandbags) {
      if (Math.hypot(pp.x-b.x, pp.z-b.z) < 1.6 && pp.y < H(b.x, b.z)+1.6) { done = true; break; }
    }
    // 地面
    if (!done && pp.y <= H(pp.x, pp.z)) {
      if (p.blast) { explode(pp.clone(), true); blastDamage(pp, p.blast, p.dmg, p.owner); }
      done = true;
    }
    // 兵にあたる
    if (!done) {
      if (p.owner === 'foe') {
        if (pp.distanceTo(P) < (G.crouch ? 0.9 : 1.2) + 0.4) { hitPlayer(p.dmg); done = true; }
        if (!done) for (const s of soldiers) {
          if (s.faction !== 'ally' || s.state !== 'fight') continue;
          if (pp.distanceTo(s.group.position) < 1.5) { hitSoldier(s, p.dmg, 'foe'); done = true; break; }
        }
      } else {
        for (const s of soldiers) {
          if (s.faction !== 'foe' || s.state !== 'fight') continue;
          if (pp.distanceTo(s.group.position) < 1.5) {
            if (p.blast) { explode(pp.clone(), true); blastDamage(pp, p.blast, p.dmg, p.owner); }
            else hitSoldier(s, p.dmg, p.owner);
            done = true; break;
          }
        }
      }
    }
    if (done || p.life <= 0) { scene.remove(p.mesh); projs.splice(i, 1); }
  }
  for (let i = explosions.length-1; i >= 0; i--) {
    const e = explosions[i];
    e.life -= dt;
    e.mesh.scale.multiplyScalar(1 + dt*4);
    e.mesh.material.opacity = Math.max(0, e.life);
    if (e.life <= 0) { scene.remove(e.mesh); explosions.splice(i, 1); }
  }

  // ---- のっとり（監督ルール：敵の要塞をのっとったら勝ち） ----
  const capBar = $('capBarWrap');
  let showBar = false;
  for (const F of fortresses) {
    const enemyOfF = F.side === 'ally' ? 'foe' : 'ally';
    let attackers = 0;
    for (const s of soldiers) {
      if (s.faction === enemyOfF && s.state === 'fight' &&
          Math.hypot(s.group.position.x-F.x, s.group.position.z-F.z) < F.zone) attackers++;
    }
    const meIn = F.side === 'foe' && Math.hypot(P.x-F.x, P.z-F.z) < F.zone;
    if (meIn) attackers++;
    if (attackers > 0) {
      F.capT += dt;
      if (meIn) {
        showBar = true;
        $('capLabel').textContent = '🚩 のっとり中…！';
        $('capFill').style.width = Math.min(100, F.capT/3*100) + '%';
      }
      if (F.side === 'ally' && F.capT > 1 && !F.warned) { F.warned = true; showMessage('⚠⚠ じぶんの要塞が のっとられそう！！ もどれ！！', 3); }
      if (F.capT >= 3) {
        if (F.side === 'foe') return win();
        else return lose();
      }
    } else { F.capT = Math.max(0, F.capT - dt*2); F.warned = false; }
  }
  capBar.style.display = showBar ? 'block' : 'none';

  // ---- カメラ（三人称・うしろから。スコープ中はまっすぐ遠くを見る） ----
  const camOff = tmpV.set(Math.sin(player.yaw)*7, 4.5, Math.cos(player.yaw)*7);
  camera.position.lerp(camOff.add(P), 1 - Math.pow(0.001, dt));
  camera.position.y = Math.max(camera.position.y, H(camera.position.x, camera.position.z) + 1.6);
  camera.lookAt(P.x + fwd.x*(G.scope ? 60 : 8), P.y + 1.8, P.z + fwd.z*(G.scope ? 60 : 8));

  // ---- HUD ----
  $('hpFill').style.width = Math.max(0, G.hp/G.maxHp*100) + '%';
  $('grenCt').textContent = G.gren;
  $('cdRow').textContent = grenCd > 0 ? '⏳ つぎの手榴弾まで ' + Math.ceil(grenCd) + '秒' : '';
  $('cannonCt').textContent = G.cannon;
  const dx = FORT_FOE.x - P.x, dz = FORT_FOE.z - P.z;
  const rel = Math.atan2(dx, dz) - (player.yaw + Math.PI);
  $('arrowIcon').style.transform = `rotate(${-rel*180/Math.PI}deg)`;
  $('arrowDist').textContent = Math.round(Math.hypot(dx, dz)) + 'm';
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('message').style.opacity = 0; }

  // 遠い兵のHPバーは消す（近くの戦いだけ見えればいい／画面が札だらけになるのを防ぐ）
  for (const s of soldiers) {
    if (s.hpSprite) s.hpSprite.visible = s.state === 'fight' && s.group.position.distanceTo(P) < 70;
    // ⚠ 倒れた兵は横向きに寝るので、影も一緒に立ってしまう。そのときは消す
    if (s.group.userData.shadow) s.group.userData.shadow.visible = s.state === 'fight';
  }

  drawMinimap();
  renderer.render(scene, camera);
}

// ============ レーダー（海戦とおなじ・自分がいつも まんなか＝とみさわさんの方式） ============
const mm = $('minimap').getContext('2d');
function drawMinimap() {
  mm.clearRect(0, 0, 140, 140);
  const sc = 140/500, ox = 70, oy = 70;
  const P = player.group.position;
  const sx = x => ox + (x - P.x)*sc, sy = z => oy + (z - P.z)*sc;
  const M = 7;
  const clamp = v => Math.max(M, Math.min(140-M, v));
  for (const F of fortresses) {
    mm.fillStyle = F.side === 'ally' ? '#29b6f6' : '#ff1744';
    mm.beginPath(); mm.arc(clamp(sx(F.x)), clamp(sy(F.z)), 5, 0, 7); mm.fill();
    mm.strokeStyle = '#fff'; mm.lineWidth = 1.2; mm.stroke();
  }
  for (const s of soldiers) {
    if (s.state === 'dead') continue;
    const x = sx(s.group.position.x), y = sy(s.group.position.z);
    if (x < M || x > 140-M || y < M || y > 140-M) continue;
    mm.fillStyle = s.state === 'down' ? '#ffe066' : s.faction === 'foe' ? '#ff5252' : '#00e676';
    mm.fillRect(x-2, y-2, 4, 4);
  }
  mm.save();
  mm.translate(ox, oy);
  mm.rotate(-player.yaw + Math.PI);
  mm.fillStyle = '#fff';
  mm.beginPath(); mm.moveTo(0, -5); mm.lineTo(3.5, 4); mm.lineTo(-3.5, 4); mm.closePath(); mm.fill();
  mm.restore();
}

// ============ 勝ち負け ============
function win() {
  G.running = false;
  logEvent('win', { kills: G.kills });
  $('endTitle').textContent = '🏆 要塞を のっとった！！';
  $('endText').textContent = G.myNation.flag + ' ' + G.myNation.name + '軍の かち！　たおした数：' + G.kills;
  endCommon();
}
function lose() {
  G.running = false;
  logEvent('lose', { kills: G.kills });
  $('endTitle').textContent = '😢 要塞を のっとられた…';
  $('endText').textContent = 'つぎは 要塞を まもりながら せめよう！　たおした数：' + G.kills;
  endCommon();
}
function endCommon() {
  $('endScreen').style.display = 'flex';
  $('capBarWrap').style.display = 'none';
  for (const id of ['fireBtn', 'grenBtn', 'skillBtn', 'cannonBtn', 'crouchBtn']) $(id).style.display = 'none';
}
$('btnGo').onclick = startGame;
// ?dev=1 のときだけ、テスト用にコンソールから中を触れる（v6と同じ流儀）
if (DEVMODE) {
  window.dbg = () => ({ G, player, soldiers, projs, sandbags, fortresses, startGame, keys, H, standH, LADDERS, PLATFORMS, houses, rocks, hitPlayer, hitSoldier, THREE, camera, scene });
}
$('btnRetry').onclick = () => { $('endScreen').style.display = 'none'; $('titleScreen').style.display = 'flex'; };

tick();
</script>
