<script>
const BUILD = 'koeki-0911a';   // ⚠ 版の印
document.getElementById('buildTag').textContent = BUILD;
const Q = new URLSearchParams(location.search);

// ============ ログ計装（常時ON・パパ方針「テストプレイは全部データ」）============
const LOG_TAG = Q.get('tag') || 'koeki';
const STARTED = new Date().toISOString();
const LOG_KEY = 'yuujinKoekiLog_' + STARTED.replace(/[:.]/g, '-') + '_' + LOG_TAG;
const gameLog = [];
function logEvent(type, data) { gameLog.push({ t: Math.round(performance.now()), type, data }); }
function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify({ ver: location.pathname, tag: LOG_TAG, started: STARTED, events: gameLog.slice(-3000) })); }
  catch (e) { console.warn('⚠ ログを保存できなかった', e); }
}
setInterval(saveLog, 10000);
addEventListener('beforeunload', saveLog);
window.gameLog = gameLog;
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyMDP1lVKD7YRe3A0Z37qr9W6fMOcIyPiy-c_d2kZs1ywQCeeBrwLz7sm6-5tKqYomX/exec';
if (!localStorage.getItem('yuujinDevice')) localStorage.setItem('yuujinDevice', 'pc-' + Math.random().toString(36).slice(2, 7));
if (!localStorage.getItem('yuujinWord')) {
  const B = ['ねこ','いぬ','くじら','さめ','かめ','たか','わし','ぺんぎん','らっこ','きつね'];
  localStorage.setItem('yuujinWord', B[Math.floor(Math.random()*B.length)] + (100 + Math.floor(Math.random()*900)));
}
document.getElementById('titleWord').textContent = localStorage.getItem('yuujinWord');
let sentCount = 0, sending = false;
async function sendLog() {
  if (sending || sentCount >= gameLog.length) return;
  sending = true;
  const upto = gameLog.length;
  try {
    const res = await fetch(CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ key: 'yuujin2026', runId: LOG_KEY, device: localStorage.getItem('yuujinDevice'),
        ver: location.pathname, tag: LOG_TAG, build: BUILD, word: localStorage.getItem('yuujinWord'),
        nation: G.nation ? G.nation.id : '', events: gameLog.slice(sentCount, upto) }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    sentCount = upto;
  } catch (e) { console.warn('⚠ ログを送れなかった。次の60秒でまた試す', e); }
  finally { sending = false; }
}
setInterval(sendLog, 60000);
addEventListener('beforeunload', () => {
  if (sentCount < gameLog.length)
    navigator.sendBeacon(CLOUD_URL, new Blob([JSON.stringify({ key: 'yuujin2026', runId: LOG_KEY,
      device: localStorage.getItem('yuujinDevice'), ver: location.pathname, tag: LOG_TAG, build: BUILD,
      events: gameLog.slice(sentCount) })], { type: 'text/plain' }));
});
logEvent('open', { ua: navigator.userAgent, w: innerWidth, h: innerHeight });

// ============ 監督の確定仕様（9/9「交易物語」）============
// 「まず最初に世界地図が出てきて海が無くても陸で動ける」「世界地図で自分は、どこの国か選べる」

// 「ゲームの核は、お金で買えること」「１８８７年」
// 参考（パパ）：東インド会社ボドゲ＝安く買って高く売る・株価変動

const NATIONS = [

const CITIES = [

  { id:'cairo',  name:'カイロ',       nat:null, x:578, y:300, mult:{tea:1.0, silk:1.0, cot:0.6, iron:1.3, cof:1.2} },

  { id:'beijing',name:'北京',         nat:'cn', x:880, y:176, mult:{tea:0.5, silk:0.6, cot:1.1, iron:1.5, cof:1.5} },
  { id:'tokyo',  name:'東京',         nat:'jp', x:946, y:232, mult:{tea:0.6, silk:0.5, cot:1.2, iron:1.5, cof:1.6} },
  { id:'ny',     name:'ニューヨーク', nat:null, x:214, y:166, mult:{tea:1.5, silk:1.4, cot:0.8, iron:0.9, cof:0.9} },
  { id:'rio',    name:'リオ',         nat:null, x:258, y:392, mult:{tea:1.3, silk:1.3, cot:0.7, iron:1.4, cof:0.4} },
  // ↓ パパ9/10「線路を引ける場所をもっとふやそうか　史実に即してるといいね」で足した5つ。
  //   ⚠ どれも「そこに ほんものの鉄道の話がある街」だけを えらんだ。

//   そのかわり 茶のもうけが大きい（ほんもののキャフタ茶貿易とおなじ理くつ）。
// ⚠ ボンベイ⇔シンガポール等も ほんとうは船の時代なので 海の道に直した（教材ページと合わせる）
const ROADS = [
  ['london','paris','sea',2], ['london','amst','sea',2], ['paris','amst','rail',1],
  ['amst','berlin','rail',1], ['paris','madrid','rail',1], ['madrid','lisbon','rail',1],
  ['paris','rome','rail',1], ['rome','berlin','rail',1], ['berlin','moscow','rail',1],
  ['rome','cairo','sea',2], ['moscow','beijing','camel',3],   // 🐫 ほんものの「茶の道」

  ['beijing','tokyo','sea',2], ['london','ny','sea',2], ['ny','rio','sea',2], ['lisbon','rio','sea',2],
  // ↓ 1887年に **もう完成していた** 鉄道（だから 引くのではなく 最初からある）
  ['ny','sf','rail',1],          // 大陸横断鉄道 1869年5月10日 完成（ユタ州プロモントリー）

// ⚠ どれも **ほんとうにあった話**。年号は 検索して 目で見て たしかめた（記憶では書かない）。
//   real = 「ほんものだと いつ できたか」。ゲームの中では 1887年に じぶんで 先に作れる。
//   ⚠ ケープ〜カイロだけ real が null ＝ **ほんものは 最後まで つながらなかった**。
//     つまり ここを引けたら、ゆうじんは 歴史がやれなかったことを やったことになる。
const RAIL_PROJECTS = [
  { a:'moscow', b:'beijing', name:'シベリア鉄道',      cost:500, fee:40, real:1916,
    note:'1891年に工事がはじまって、ぜんぶつながったのは1916年。25年かかった' },
  { a:'london', b:'paris',   name:'英仏海峡トンネル',  cost:400, fee:25, real:1994,
    note:'1880年にほんとうに掘りはじめて、3.5kmまで掘れた。でも1883年に「せめこまれる」と' +
         'イギリスの軍がこわがって 中止になった。できたのは111年あとの1994年' },
  { a:'moscow', b:'samar',   name:'カスピ海横断鉄道',  cost:350, fee:20, real:1888,
    note:'1880年に工事がはじまって、1888年5月にサマルカンドまでとどいた。' +
         'このゲームの1887年は、あと1年というところ' },
  { a:'paris',  b:'ist',     name:'オリエント急行の直通', cost:300, fee:20, real:1889,
    note:'1883年から走っていたけど、川と海は 船にのりかえだった。' +
         'ぜんぶ線路でつながったのは1889年6月1日' },
  { a:'cairo',  b:'cape',    name:'ケープ〜カイロ鉄道', cost:700, fee:50, real:null,
    note:'アフリカを たてにつらぬく計画。ほかの国が じゃまをして **いまも つながっていない**' },
];

// ⚠ 道は 同じ2つの街のあいだに **何本あってもいい**。
//   （線路を引いても 🐫の道は消さない＝パパ9/9「選択肢として共存できる形をさぐりたい」）
const roadsBetween = (a, b) => ROADS.filter(r => (r[0] === a && r[1] === b) || (r[0] === b && r[1] === a));
const roadOf = (a, b) => roadsBetween(a, b)[0];
// 通行料。⚠ 🐫とお船はタダ。🚂は石炭代がかかる＝**はやいけど お金がへる**。
//   これで「急ぐか、節約するか」を えらべる（どちらかが消えない）
// ⚠ 道が無いところへ動かされることがある（テストや、あとで足す機能）。
//   r が無いのに r[4] を読むと **そこでゲームが止まる**。0を返して先へ進める
const roadFee = r => (r && r[4]) || 0;
// 🏗 建物の大きさ（監督9/9 22:16「最初は小さい工場と小さい茶畑しかない」）。
// ⚠ 「小さい」と言った＝**大きくできる**ということ。監督の核「お金で買える」がここにも効く。
//    小さい(1) → ふつう(2) → 大きい(3)。作る数／売値が 大きさぶん増える
const SIZE_NAME = ['', '小さい', 'ふつうの', '大きい'];
const LAND_COST = 80;
const FARM_COST    = [0, 90, 200, 420];    // 🌱 畑：茶をつくる（監督の「茶畑」）
const FACTORY_COST = [0, 120, 260, 540];   // 🏭 工場：その街の名産をつくる
const MARKET_COST  = [0, 100, 220, 460];   // 🏪 市場：売値が上がる
const MARKET_MUL   = [1, 1.3, 1.5, 1.8];
// 🚉 駅（監督9/10 20:25「駅を作ると1日に500ドルもらえる」）。
// ⚠ ここまでの たてものは ぜんぶ「**物**ができる」だけ＝売りに行かないと お金にならない。
//   駅は **行かなくても お金が入る**。監督が足したのは、それまで無かった種類のもの。
//   （パパ「モノポリーみたくなってきたね」→ 監督「OK」）
// ⚠ 500という数は 監督の数。**いちばん大きい駅**の数として そのまま入れた。
//   いまの経済（さいしょ💰100・土地80）に いきなり1日500を出すと 1個で全部ひっくり返るので、
//   小さい駅から3段階にした。核（=持っているだけで毎日入る）は 1段目から効く。
//   ⚠ 買値と実入りは **遊んで測ってから** 詰める（ここは まだ仮の数）
// ⚠ 9/11 実測して 直した数。前は [600,1300,2600]＝**大きくするほど もとが早く取れる**形で、
//   それだと「まっすぐ最大まで上げる」以外に えらびようが無くなる。畑90/200/420（1コあたり90→100→140）
//   と同じで、**大きいほど 割高**にした。3段目4000は 交易をだいぶ やらないと 届かない大金
const STATION_COST   = [0, 600, 1600, 4000];
const STATION_INCOME = [0, 100,  250,  500];   // 1日あたり
// 🚂 駅は **線路が来ている街にしか** 建てられない。
//   ⚠ これで「線路を引く」と「駅を建てられる街が増える」がつながる。
//   1887年に線路がある街は11コ。シベリア鉄道などを引くと ロンドン・北京・サマルカンド…と増える
const hasRail = cid => ROADS.some(r => (r[2] === 'rail' || r[2] === 'mix') && (r[0] === cid || r[1] === cid));
// その日ぶんの 駅の実入り（持っている駅ぜんぶ）
const stationIncome = () => Object.values(G.own).reduce((a, o) => a + STATION_INCOME[o.station || 0], 0);
const CARGO_MAX = 10, START_MONEY = 100;
const cityById = id => CITIES.find(c => c.id === id);
const linked = (a, b) => ROADS.some(r => (r[0] === a && r[1] === b) || (r[0] === b && r[1] === a));

// ============ 状態 ============
const G = { started: false, nation: null, at: null, day: 0, money: START_MONEY,
            cargo: {}, own: {}, msgT: 0, choose: null };
// own[cityId] = { land:true, farm:0, factory:0, market:0, stock:{商品id: 数} }
//   farm/factory/market は **大きさ**（0=無い／1小さい／2ふつう／3大きい）
GOODS.forEach(g => G.cargo[g.id] = 0);
const cargoCount = () => GOODS.reduce((a, g) => a + G.cargo[g.id], 0);
// その街の いちばんの名産（mult最小の商品）＝工場が作るもの
const specialty = c => GOODS.reduce((a, g) => c.mult[g.id] < c.mult[a.id] ? g : a, GOODS[0]);
// 値段。⚠ 「株価変動」（参考ボドゲ）：日ごとに ゆっくり波打つ＋街ごとに位相をずらす。
//    乱数でなく波にする＝「待てば変わる」「よその街は今どうか」を考えられる
function price(c, g, day = G.day) {
  const wave = 1 + 0.22 * Math.sin(day * 0.55 + c.x * 0.05 + GOODS.indexOf(g) * 1.7);
  return Math.max(3, Math.round(g.base * c.mult[g.id] * wave));
}
const companyNations = () => {
  const set = new Set();
  for (const [cid, o] of Object.entries(G.own)) if (o.land) {
    const c = cityById(cid);
    set.add(c.nat || c.id);   // 中立の街（カイロ等）は その街じたいを1つと数える
  }
  return set;
};
const $ = id => document.getElementById(id);
function showMessage(t, sec = 2.2) { $('msg').textContent = t; $('msg').style.opacity = 1; G.msgT = sec;
  clearTimeout(showMessage._t); showMessage._t = setTimeout(() => $('msg').style.opacity = 0, sec * 1000); }

// ============ 世界地図（canvas）============
const cv = $('map'), ctx = cv.getContext('2d');
const MAPW = 1000, MAPH = 470;
function drawMap() {
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  const s = Math.min(w / MAPW, h / MAPH);
  const ox = (w - MAPW * s) / 2, oy = (h - MAPH * s) / 2;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#16324a'; ctx.fillRect(0, 0, w, h);
  const X = c => ox + c.x * s, Y = c => oy + c.y * s;
  // 大陸のかんじ（ざっくりの形。⚠ 正確な地図より「どの街とどの街がつながるか」が本体）
  ctx.fillStyle = '#1f4a33';
  // ⚠ 街を足したら **その足もとに 陸があるか** も見る（海の上に街が浮くと 地図がうそになる）
  const blobs = [[175,215,135,130],[262,390,70,90],                 // 北アメリカ／南アメリカ
                 [460,190,155,115],                                 // ヨーロッパ（街をひろげたので 大きく）
                 [572,300,70,70], [560,398,44,86],                  // 北アフリカ／アフリカの南
                 [730,165,185,105],[800,300,105,85],                // ユーラシア／インド
                 [916,205,66,54]];                                  // 日本
  for (const [bx, by, rx, ry] of blobs) {
    ctx.beginPath(); ctx.ellipse(ox + bx*s, oy + by*s, rx*s, ry*s, 0, 0, Math.PI*2); ctx.fill();
  }
  // 道（🚂実線・🚢点線・🐫あらい点線＋ラクダのしるし）
  for (const [a, b, kind] of ROADS) {
    const A = cityById(a), B = cityById(b);
    ctx.strokeStyle = kind === 'rail' ? 'rgba(255,224,130,.6)'
                    : kind === 'camel' ? 'rgba(255,171,64,.75)'
                    : kind === 'mix' ? 'rgba(206,147,216,.7)' : 'rgba(129,212,250,.45)';
    ctx.lineWidth = kind === 'camel' ? 3 : 2;
    ctx.setLineDash(kind === 'sea' ? [6, 5] : kind === 'camel' ? [2, 6]
                  : kind === 'mix' ? [10, 4] : []);
    ctx.beginPath(); ctx.moveTo(X(A), Y(A)); ctx.lineTo(X(B), Y(B)); ctx.stroke();
    // 🐫と🔁は 見ただけで分かるように しるしを置く（線の色だけだと 区別がつかない）
    const mark = kind === 'camel' ? '🐫' : kind === 'mix' ? '🔁' : null;
    if (mark) {
      ctx.setLineDash([]);
      ctx.font = Math.max(12, 15*s) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(mark, (X(A)+X(B))/2, (Y(A)+Y(B))/2 - 4);
    }
  }
  ctx.setLineDash([]);
  // 街の点（名前は このあと まとめて置く）
  const labels = [];
  for (const c of CITIES) {
    const own = G.own[c.id];
    const here = G.at === c.id;
    const canGo = G.at && linked(G.at, c.id);
    // 🏢 会社（土地）を持つ街には じぶんの国の色の輪 ＝「占領目標」の見た目（監督9/9「入れてほしい」）
    if (own && own.land) {
      ctx.strokeStyle = G.nation.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(X(c), Y(c), 12, 0, Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle = here ? '#ffe066' : canGo ? '#fff' : '#90a4ae';
    ctx.beginPath(); ctx.arc(X(c), Y(c), here ? 8 : 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    if (own && own.factory) ctx.fillText('🏭', X(c) + 16, Y(c) + 5);
    // 🚉 駅も 地図で見えるように。⚠ 工場と かさならないよう **反対がわ**に置く
    if (own && own.station) ctx.fillText('🚉', X(c) - 16, Y(c) + 5);
    // ⚠⚠ 街が15→20にふえて、名前が となりの街と かさなって 読めなくなった。
    //   地図は 画面の1/3の幅で、字は10pxが下げ止まり＝**20コの名前は そもそも 入らない**。
    //   → ① いま いる街・行ける街・じぶんの会社がある街 だけ 名前を出す
    //     （行けない街は 点のまま。行き先をきめるのに 要る名前だけ 出る）
    //   ⚠ これは 監督が たのんだ変更ではない。読めないのを直すため。いやなら もどす
    if (here || canGo || (own && own.land))
      labels.push({ c, here, prio: here ? 0 : (own && own.land) ? 1 : 2 });
  }
  // ② それでも 近い街どうしは ぶつかる（ロンドンとアムステルダムなど）。
  //    **置いた場所をおぼえておいて、ぶつかったら 下・上・もっと下…と ずらす**。
  //    ⚠ どこにも置けなかったら **出さない**。重ねて 両方読めなくするより ましだから
  ctx.font = 'bold ' + Math.max(10, 13*s) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  const fh = Math.max(10, 13*s), placed = [];
  drawMap._labels = window.drawMapLabels = []; drawMap._overlap = 0;   // ⚠ どの名前を どこに置いたかを 残す（目で見るのでなく 測るため）
  // ⚠ 街の点と🏭のしるしも「ふさがっている場所」に入れる。
  //   入れないと、となりの街の名前が **点や🏭の上に かぶって**「ロン｜ドン」みたいに欠ける
  for (const c of CITIES) {
    const o = G.own[c.id];
    placed.push({ x1: X(c) - 9, x2: X(c) + (o && o.factory ? 30 : 9), y1: Y(c) - 9, y2: Y(c) + 9 });
  }
  labels.sort((a, b) => a.prio - b.prio);      // 大事な名前から 先に よい場所をとる
  // 名前を置いてみる場所。上→下→右→左→もっと上… の順に ためす。
  // ⚠ 上下だけだと 足りなかった（アムステルダムとローマが 消えた）。**横にも のがす**
  const SPOTS = [[0,-12,'center'], [0,20,'center'], [12,4,'left'], [-12,4,'right'],
                 [0,-26,'center'], [0,34,'center'], [13,-11,'left'], [-13,-11,'right'],
                 [13,19,'left'], [-13,19,'right'],
                 // ⚠ ここまでで足りず 4つの街で 重なった（実測）。もっと遠くにも のがす
                 [0,-40,'center'], [0,48,'center'], [26,-25,'left'], [-26,-25,'right'],
                 [26,33,'left'], [-26,33,'right'], [0,-54,'center'], [0,62,'center'],
                 [40,-8,'left'], [-40,-8,'right'], [0,-68,'center'], [0,76,'center'],
                 [40,-40,'left'], [-40,-40,'right'], [40,26,'left'], [-40,26,'right']];
  for (const L of labels) {
    const cx = X(L.c), cy = Y(L.c), tw = ctx.measureText(L.c.name).width;
    // ld:'down' の街は 下から ためす（となりと ぶつかりにくい向きが 分かっている街）
    const spots = L.c.ld === 'down' ? [SPOTS[1], SPOTS[0], ...SPOTS.slice(2)] : SPOTS;
    let put = null;
    for (const [dx, dy, al] of spots) {
      const x = cx + dx;
      const x1 = al === 'center' ? x - tw/2 : al === 'left' ? x : x - tw;
      const r = { x1: x1 - 2, x2: x1 + tw + 2, y1: cy + dy - fh, y2: cy + dy + 3 };
      // ⚠ 画面から はみ出す場所は えらばない。遠くへ のがすと 外に出る
      //   （サンフランシスコの名前が 左のふちで 切れていた・実測）
      if (r.x1 < 1 || r.x2 > w - 1 || r.y1 < 1 || r.y2 > h - 1) continue;
      if (!placed.some(q => r.x1 < q.x2 && r.x2 > q.x1 && r.y1 < q.y2 && r.y2 > q.y1)) {
        placed.push(r); put = [x, cy + dy, al]; break;
      }
    }
    // ⚠ どこにも置けなくても **出す**（上に重ねる）。行ける街の名前が消えるほうが こまる
    if (!put) {
      // どこにも置けない＝重ねてでも出す。⚠ ただし 画面の中に おさめる
      put = [Math.min(w - tw/2 - 2, Math.max(tw/2 + 2, cx)), Math.max(fh + 2, cy - 12), 'center'];
      drawMap._overlap = (drawMap._overlap || 0) + 1;
    }
    drawMap._labels.push({ name: L.c.name, x: put[0], y: put[1], al: put[2], w: tw });
    ctx.textAlign = put[2];
    ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3;
    ctx.strokeText(L.c.name, put[0], put[1]);  // 黒いふちどり＝海の上でも 陸の上でも 読める
    ctx.fillStyle = L.here ? '#ffe066' : '#fff';
    ctx.fillText(L.c.name, put[0], put[1]);
  }
  ctx.textAlign = 'center';
  // タップ判定用に保存
  drawMap._geo = { s, ox, oy };
}
cv.addEventListener('pointerdown', e => {
  if (!G.started || !drawMap._geo) return;
  const r = cv.getBoundingClientRect();
  const { s, ox, oy } = drawMap._geo;
  const mx = (e.clientX - r.left - ox) / s, my = (e.clientY - r.top - oy) / s;
  let hit = null, hd = 26;
  for (const c of CITIES) { const d = Math.hypot(c.x - mx, c.y - my); if (d < hd) { hd = d; hit = c; } }
  if (!hit) return;
  if (hit.id === G.at) return;
  const rs = roadsBetween(G.at, hit.id);
  if (!rs.length) { showMessage('⚠ ' + hit.name + 'へは 道がつながってない', 1.6); return; }
  if (rs.length === 1) { travel(hit, rs[0]); return; }
  // ⚠ 道が2本あるときは **えらばせる**。かってに はやいほうを使うと、
  //   「線路を引いた意味」も「ラクダのほうが得な時がある」も 分からなくなる
  G.choose = { city: hit, roads: rs };
  render();
});

// ============ すすむ ============
function travel(c, road) {
  road = road || roadOf(G.at, c.id);
  const days = road ? road[3] : 1;
  const fee = roadFee(road);
  if (fee > G.money) { showMessage('⚠ 石炭代（' + fee + '）が たりない', 1.8); return; }
  G.money -= fee;
  G.at = c.id; G.day += days;
  // 🌱🏭 畑と工場は 行ってない街でも 毎日つくる。⚠ 3日の道なら 3日ぶん、大きさぶん たまる
  for (const [cid, o] of Object.entries(G.own)) {
    o.stock = o.stock || {};
    if (o.farm) o.stock.tea = Math.min(30, (o.stock.tea || 0) + o.farm * days);
    if (o.factory) {
      const sp2 = specialty(cityById(cid));
      o.stock[sp2.id] = Math.min(30, (o.stock[sp2.id] || 0) + o.factory * days);
    }
  }
  // 🚉 駅の実入り。⚠ 畑や工場と同じで **3日の道なら3日ぶん**。
  //   ここに置くのは、日がすすむ場所が travel しか無いから（あとで「1日待つ」を足すなら そこにも要る）
  const inc = stationIncome() * days;
  if (inc) G.money += inc;
  logEvent('travel', { to: c.id, day: G.day, days, kind: road ? road[2] : '?', fee, station: inc, money: G.money });
  const icon = road ? ROAD_ICON[road[2]] : '🧳';
  showMessage(icon + ' ' + days + '日かけて ' + c.name + 'に ついた' +
    (fee ? '（石炭 -' + fee + '）' : '') + (inc ? '（🚉 +' + inc + '）' : ''), 1.6);
  render();
}
function dateStr() {
  // 1887年1月1日から 1日ずつ。⚠ 監督「１８８７年」＝年は画面にいつも出す
  const d = new Date(1887, 0, 1); d.setDate(d.getDate() + G.day);
  return '1887年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

// ============ 画面 ============
function render() {
  // ⚠ ほぞんは **1か所**に置く。買う・売る・進む・建てる…と場所ごとに書くと
  //   あとで足した操作で ほぞんし忘れる（監督の500が消える事故になる）
  saveGame();
  drawMap();
  $('hudDate').textContent = '📅 ' + dateStr();
  $('hudMoney').textContent = '💰 ' + G.money;
  $('hudCo').textContent = '🏢 ' + companyNations().size + 'か国';
  // 🚉 駅を1つも持っていないうちは 出さない（からっぽの「+0」は 意味がないうえ 場所を食う）
  const inc0 = stationIncome();
  $('hudInc').textContent = inc0 ? '🚉 1日+' + inc0 : '';
  const c = cityById(G.at);
  const own = G.own[c.id] || {};
  const sp = specialty(c);
  let h = '<h2>📍 ' + c.name + (c.nat ? '（' + NATIONS.find(n => n.id === c.nat).name + '）' : '') + '</h2>';
  h += '<div class="sub">名産は ' + sp.icon + sp.name + '。にもつ ' + cargoCount() + '/' + CARGO_MAX + '</div>';
  // たてもの（監督「土地も買えるし工場も市場も作れる駄々しお金があれば」＋9/9「最初は小さい〜」）
  // ⚠ **いまの大きさと つぎの値段を いつも見せる**。見えないと お金をためる理由が分からない
  let bh = '<div class="row">';
  if (!own.land) bh += '<button class="build" data-act="land"' + (G.money < LAND_COST ? ' disabled' : '') + '>🏢 土地を買う（' + LAND_COST + '）</button>';
  else {
    bh += '<span>🏢 会社あり</span>';
    const one = (key, icon, name, costs, extra) => {
      const lv = own[key] || 0;
      let t = '';
      if (lv > 0) t += '<span>' + icon + ' ' + SIZE_NAME[lv] + name + (extra ? '（' + extra(lv) + '）' : '') + '</span>';
      if (lv < 3) t += '<button class="build" data-act="' + key + '"' + (G.money < costs[lv+1] ? ' disabled' : '') + '>' +
        icon + (lv === 0 ? ' ' + name + 'を作る' : ' 大きくする') + '（' + costs[lv+1] + '）→' + SIZE_NAME[lv+1] + name + '</button>';
      return t;
    };
    bh += one('farm', '🌱', '茶畑', FARM_COST, lv => '1日に🍵' + lv);
    bh += one('factory', '🏭', '工場', FACTORY_COST, lv => '1日に' + sp.icon + lv);
    bh += one('market', '🏪', '市場', MARKET_COST, lv => '売値' + MARKET_MUL[lv] + '倍');
    // 🚉 線路が来ている街だけ。⚠ 来ていない街では **なぜ出ないのか**を書く。
    //   ボタンが黙って消えると「バグ」に見える（v6のタイトル画面で同じことを学んだ）
    if (hasRail(c.id)) bh += one('station', '🚉', '駅', STATION_COST, lv => '1日に💰' + STATION_INCOME[lv]);
    else bh += '<span>🚉 駅は 線路が来ている街だけ</span>';
    const st = own.stock || {};
    const total = Object.values(st).reduce((a2, b2) => a2 + b2, 0);
    if (total > 0) bh += '<button class="build" data-act="collect">📦 回収（' +
      Object.entries(st).filter(x => x[1] > 0).map(x => (GOODS.find(y => y.id === x[0]) || {}).icon + x[1]).join(' ') + '）</button>';
  }
  bh += '</div>';
  h += '<table>';
  for (const g of GOODS) {
    const p = price(c, g), py = price(c, g, G.day - 1);
    const arrow = p > py ? '<span class="up">▲</span>' : p < py ? '<span class="down">▼</span>' : '・';
    const sellP = Math.round(p * MARKET_MUL[own.market || 0]);
    h += '<tr><td>' + g.icon + ' ' + g.name + '（もってる ' + G.cargo[g.id] + '）</td>' +
      '<td class="num">' + p + ' ' + arrow + '</td>' +
      '<td><button class="buy" data-buy="' + g.id + '"' + (G.money < p || cargoCount() >= CARGO_MAX ? ' disabled' : '') + '>買う</button>' +
      '<button class="sell" data-sell="' + g.id + '"' + (G.cargo[g.id] <= 0 ? ' disabled' : '') + '>売る ' + sellP + '</button></td></tr>';
  }
  h += '</table>';
  // 🛤 道が2本あるとき：どっちで行くかを えらぶ
  if (G.choose) {
    h += '<div class="row" style="background:#1b3a2a;border-radius:9px;padding:6px;margin:4px 0">' +
      '<b>' + G.choose.city.name + 'へ どっちで行く？</b>';
    G.choose.roads.forEach((r, i) => {
      const fee = roadFee(r);
      h += '<button class="build" data-go="' + i + '">' + ROAD_ICON[r[2]] + ' ' + r[3] + '日' +
        (fee ? '（石炭 ' + fee + '）' : '（タダ）') + '</button>';
    });
    h += '<button data-go="x">やめる</button></div>';
  }
  h += bh;
  // 🚂 線路を引く（この街から出ている 🐫の道があるとき）
  for (const rp of RAIL_PROJECTS) {
    if (c.id !== rp.a && c.id !== rp.b) continue;
    if (roadsBetween(rp.a, rp.b).some(r => r[2] === 'rail')) continue;   // もう引いてあれば出さない
    // ⚠ 前は「🐫3日タダ の となりに」と 決めうちで書いていた。線路が5本になって
    //   となりが 🚢や🔁 のこともある＝**いま実際にある道**から 文を作る
    const now = roadsBetween(rp.a, rp.b)[0];
    const nowTxt = now ? ROAD_ICON[now[2]] + now[3] + '日' + (roadFee(now) ? '(石炭' + roadFee(now) + ')' : 'タダ') : '道なし';
    h += '<div class="row"><button class="build" data-rail="' + rp.a + ':' + rp.b + '"' +
      (G.money < rp.cost ? ' disabled' : '') + '>🚂 ' + rp.name + 'を引く（' + rp.cost + '）<br>' +
      'いまは ' + nowTxt + '／引くと 🚂1日(石炭' + rp.fee + ') も えらべる</button></div>' +
      '<div class="sub" style="margin:-2px 0 6px">📖 ' + rp.note + '</div>';
  }

  h += '<div class="sub" style="margin-top:6px">🗺 地図の <b>名前が出ている街</b>に 行ける（おすと すすむ）。' +
       '🚂鉄道=1日・🚢船=2日・🐫キャラバン=3日。道が2本あるときは えらべる</div>';
  $('panel').innerHTML = h;
  for (const b of $('panel').querySelectorAll('[data-buy]')) b.onclick = () => trade(b.dataset.buy, +1);
  for (const b of $('panel').querySelectorAll('[data-sell]')) b.onclick = () => trade(b.dataset.sell, -1);
  for (const b of $('panel').querySelectorAll('[data-act]')) b.onclick = () => act(b.dataset.act);
  for (const b of $('panel').querySelectorAll('[data-rail]')) b.onclick = () => buildRail(b.dataset.rail);
  for (const b of $('panel').querySelectorAll('[data-go]')) b.onclick = () => {
    const ch = G.choose; G.choose = null;
    if (b.dataset.go === 'x' || !ch) { render(); return; }
    travel(ch.city, ch.roads[+b.dataset.go]);
  };
}
function trade(gid, dir) {
  const c = cityById(G.at), g = GOODS.find(x => x.id === gid);
  const own = G.own[c.id] || {};
  if (dir > 0) {
    const p = price(c, g);
    if (G.money < p || cargoCount() >= CARGO_MAX) return;
    G.money -= p; G.cargo[gid]++;
    logEvent('buy', { g: gid, p, at: c.id });
  } else {
    if (G.cargo[gid] <= 0) return;
    const p = Math.round(price(c, g) * MARKET_MUL[own.market || 0]);
    G.money += p; G.cargo[gid]--;
    logEvent('sell', { g: gid, p, at: c.id });
  }
  render();
}
function act(kind) {
  const c = cityById(G.at);
  const own = G.own[c.id] = G.own[c.id] || { land: false, farm: 0, factory: 0, market: 0, stock: {} };
  const COSTS = { farm: FARM_COST, factory: FACTORY_COST, market: MARKET_COST, station: STATION_COST };
  const ICONS = { farm: '🌱', factory: '🏭', market: '🏪', station: '🚉' };
  const NAMES = { farm: '茶畑', factory: '工場', market: '市場', station: '駅' };
  if (kind === 'land' && !own.land && G.money >= LAND_COST) {
    G.money -= LAND_COST; own.land = true;
    const n = companyNations().size;
    showMessage('🏢 ' + c.name + 'に 会社をつくった！（' + n + 'か国め）', 2.4);
    logEvent('land', { at: c.id, nations: n });
    if (n === 5) { showMessage('🎉 5か国に 会社ができた！ りっぱな商人だ！', 3.5); logEvent('five_nations', {}); }
  } else if (COSTS[kind] && own.land) {
    // ⚠ 見た目で隠すだけにしない。線路の無い街で 駅が建つ道を ここで閉じる
    if (kind === 'station' && !hasRail(c.id)) { showMessage('⚠ ' + c.name + 'には まだ 線路が来ていない', 1.8); return; }
    const lv = own[kind] || 0;
    if (lv >= 3 || G.money < COSTS[kind][lv+1]) return;
    G.money -= COSTS[kind][lv+1]; own[kind] = lv + 1;
    showMessage(ICONS[kind] + ' ' + SIZE_NAME[lv+1] + NAMES[kind] + 'に なった！', 2.2);
    logEvent(kind, { at: c.id, lv: lv + 1 });
  } else if (kind === 'collect') {
    const st = own.stock || {};
    let took = 0; const names = [];
    for (const g of GOODS) {
      const have = st[g.id] || 0;
      if (have <= 0) continue;
      const take = Math.min(have, CARGO_MAX - cargoCount());
      if (take <= 0) break;
      st[g.id] -= take; G.cargo[g.id] += take; took += take; names.push(g.icon + take);
    }
    if (took === 0) { showMessage('⚠ にもつが いっぱい', 1.4); return; }
    showMessage('📦 ' + names.join(' ') + ' 回収した', 1.8);
    logEvent('collect', { at: c.id, n: took });
  }
  render();
}

// 🚂 線路を引く。⚠ ROADS の中身を書きかえる＝地図も日数も そのまま新しくなる
//   （別の場所に「引いた印」を持つと、地図と日数が古いまま残る事故になる）
// ⚠⚠ ROADS は ゲーム中に **1本しかない** 共有の入れもの。引いた線路を そこへ足すので、
//   1ばんのセーブで シベリア鉄道を引いたあと 2ばんのセーブを読むと、
//   **2ばんでも 線路が つながったまま**になっていた（お金を はらっていないのに）。
//   読む前・新しく始める前に ここで いったん外す。呼ぶ場所ごとに書くと 足した経路が すりぬける
function clearBuiltRails() {
  for (let k = ROADS.length - 1; k >= 0; k--)
    if (ROADS[k][2] === 'rail' && ROADS[k][4]) ROADS.splice(k, 1);   // r[4]=通行料 があるのが「引いた線路」
}
function buildRail(key) {
  const [ra, rb] = key.split(':');
  const rp = RAIL_PROJECTS.find(x => x.a === ra && x.b === rb);
  if (!rp || roadsBetween(ra, rb).some(r => r[2] === 'rail') || G.money < rp.cost) return;
  G.money -= rp.cost;
  // ⚠⚠ 前は 🐫の道を 🚂に**書きかえて**いた＝せっかくの「遠くて もうかる道」が消えた。
  //   パパ9/9「選択肢として共存できる形をさぐりたい」→ **2本目の道として足す**。
  //   🐫3日タダ ／ 🚂1日だけど石炭代。どっちで行くかを えらべるようになる
  ROADS.push([rp.a, rp.b, 'rail', 1, rp.fee]);
  // ⚠ もとの道は のこる。だから「歴史が消えた」のではなく
  //   **ゆうじんが 歴史より先に 作った**ということ。そう言わないと ただ道が増えただけに見える
  //   ⚠ real が null＝ほんものは できなかった。そこは 言い方を変える（うそを言わない）
  const brag = rp.real === null ? 'ほんものは いまだに つながっていない！ 世界で さいしょだ！'
             : 'ほんものは ' + rp.real + '年。' + (rp.real - 1887) + '年 先まわりした！';
  // 🚉 引いたことで 駅を建てられるようになった街を 名前で言う。
  //   ⚠ これを言わないと「線路→駅」がつながっていることに 気づけない
  const opened = [ra, rb].filter(id => !(G.own[id] && G.own[id].station)).map(id => cityById(id).name);
  showMessage('🚂 ' + rp.name + ' かんせい！ ' + brag +
    (opened.length ? '（🚉 ' + opened.join('と') + 'に 駅を建てられる）' : ''), 4.8);
  logEvent('rail', { name: rp.name, cost: rp.cost, day: G.day, real: rp.real });
  render();
}

// ============ 💾 ほぞん（監督9/10「ほぞん出来るようにして」）============
// ⚠ 交易物語は 何日もかけて お金をためるゲーム。閉じたら消えるのでは 遊びにならない。
//   なにか動くたびに 自動でほぞんする（「セーブを押しわすれた」が起きない形）。
// ⚠ 引いた線路も ほぞんする。ROADS を書きかえているので、そこを覚えておかないと
//   つづきから始めたときに **500はらった線路が消える**
// ⚠ ほぞんは **6つ**（パパ9/10「セーブスロットは何個かつくろ」→「6個にしよ」）。
//   国は11こある。6つあれば 国ごとに ちがう商売を ためし比べられる
//   （産地が国でちがうゲームなので、ここが効く）
const SLOTS = 6;
const slotKey = i => 'koekiSave1_' + i;
let curSlot = 0;                      // いま遊んでいる ほぞんの場所
function saveGame() {
  if (!G.started) return;
  try {
    localStorage.setItem(slotKey(curSlot), JSON.stringify({
      v: 1, build: BUILD, slot: curSlot,
      nation: G.nation.id, at: G.at, day: G.day, money: G.money,
      cargo: G.cargo, own: G.own,
      rails: ROADS.filter(r => r[2] === 'rail' && r[4]).map(r => [r[0], r[1], r[3], r[4]]),
      savedAt: new Date().toISOString(),
    }));
  } catch (e) { console.warn('⚠ ほぞんできなかった（容量オーバーかも）', e); }
}
function readSave(i) {
  try { const d = JSON.parse(localStorage.getItem(slotKey(i)) || 'null'); return (d && d.v === 1) ? d : null; }
  catch (e) { return null; }
}
function loadGame(i) {
  const d = readSave(i);
  if (!d) return false;
  const nat = NATIONS.find(n => n.id === d.nation);
  if (!nat) return false;
  G.nation = nat; G.at = d.at; G.day = d.day; G.money = d.money;
  GOODS.forEach(g => G.cargo[g.id] = (d.cargo && d.cargo[g.id]) || 0);
  G.own = d.own || {};
  clearBuiltRails();
  // 引いた線路を もどす。⚠ 二重に足さないよう、同じ区間に rail が無いときだけ
  for (const [ra, rb, days, fee] of (d.rails || []))
    if (!roadsBetween(ra, rb).some(r => r[2] === 'rail')) ROADS.push([ra, rb, 'rail', days, fee]);
  curSlot = i;
  G.started = true; G.choose = null;
  $('overlay').style.display = 'none';
  showMessage('💾 ' + (i + 1) + 'ばんの つづきから！ ' + dateStr() + '・💰' + G.money, 3);
  logEvent('load', { slot: i, day: G.day, money: G.money, at: G.at });
  render();
  return true;
}
function clearSave(i) { try { localStorage.removeItem(slotKey(i)); } catch (e) {} }

// ============ タイトル ============
let pickNat = 0;
const natRow = $('natRow');
NATIONS.forEach((n, i) => {
  const b = document.createElement('button');
  b.textContent = n.name;
  b.style.borderColor = n.color;
  b.className = i === pickNat ? 'on' : '';
  b.onclick = () => { pickNat = i; logEvent('pick_nation', { id: n.id });
    for (const x of natRow.children) x.className = ''; b.className = 'on'; };
  natRow.appendChild(b);
});
// 💾 3つの ほぞん場所を ぜんぶ出す。
// ⚠ 「空いてる」も出す。出さないと **どこに ほぞんされるのか** が分からない
function paintSlots() {
  const row = $('slotRow'); row.innerHTML = '';
  for (let i = 0; i < SLOTS; i++) {
    const sv = readSave(i);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap';
    const b2 = document.createElement('button');
    // ⚠ つかっている枠は 中身を見せたいので広く、あいてる枠は 小さくてよい（場所をとらない）
    b2.style.cssText = 'text-align:left;font-size:12px;padding:5px 8px;min-height:34px;' +
      (sv ? 'min-width:180px;background:#2e7d32' : 'min-width:78px;opacity:.5');
    if (sv) {
      const nat = NATIONS.find(n => n.id === sv.nation);
      const d0 = new Date(1887, 0, 1); d0.setDate(d0.getDate() + sv.day);
      b2.innerHTML = '💾 ' + (i + 1) + '　' + (nat ? nat.name : '?') +
        '<br><span style="font-size:.8em;opacity:.85">1887年' + (d0.getMonth()+1) + '月' + d0.getDate() +
        '日／💰' + sv.money + '</span>';
      b2.onclick = () => { if (!loadGame(i)) showMessage('⚠ つづきを読めなかった', 2); };
    } else {
      b2.innerHTML = '💾 ' + (i + 1) + ' <span style="font-size:.85em;opacity:.8">あいてる</span>';
      b2.onclick = () => { curSlot = i; paintSlots(); };
    }
    if (i === curSlot) b2.style.borderColor = '#ffe066';
    wrap.appendChild(b2);
    if (sv) {
      const del = document.createElement('button');
      del.textContent = '🗑';
      del.style.cssText = 'background:#5d4037;min-height:40px';
      // ⚠ 一発では消さない。もう一度おしたら消える（まちがって消すと 取りかえせない）
      del.onclick = () => {
        if (del.dataset.armed) { clearSave(i); paintSlots(); showMessage('🗑 ' + (i+1) + 'ばんを 消した', 1.6); }
        else { del.dataset.armed = '1'; del.textContent = '🗑 ほんとに消す？';
               setTimeout(() => { del.dataset.armed = ''; del.textContent = '🗑'; }, 4000); }
      };
      wrap.appendChild(del);
    }
    row.appendChild(wrap);
  }
}
paintSlots();
$('go').onclick = () => {
  // ⚠ 新しく始めるときは 前のほぞんを消す。残すと つぎに開いたとき
  //   「つづきから」が 前の回のままになって、混ざる
  clearSave(curSlot);          // ⚠ えらんだ場所だけ消す（ほかの2つは のこす）
  clearBuiltRails();           // ⚠ 前の回で引いた線路も 外す（つづきの地図で 新規が始まらないように）
  G.day = 0; G.money = START_MONEY; G.own = {}; G.choose = null;
  GOODS.forEach(g => G.cargo[g.id] = 0);
  G.nation = NATIONS[pickNat];
  const home = CITIES.find(c => c.nat === G.nation.id);
  G.at = home.id; G.started = true;
  // 🌱🏭 監督9/9「最初は小さい工場と小さい茶畑しかない」＝**持ち物ゼロではない**。
  //   小さいのが2つだけある所から始めて、お金で大きくしていく（核＝お金で買える）
  G.own[home.id] = { land: true, farm: 1, factory: 1, market: 0, stock: {} };
  $('overlay').style.display = 'none';
  showMessage('🧳 ' + home.name + 'から出発！ 小さい工場と 小さい茶畑しかない', 3.4);
  logEvent('start', { nation: G.nation.id, home: home.id });
  render();
};
addEventListener('resize', () => { if (G.started) drawMap(); });

// ?dev=1：外から数字を見る口（⚠ 目で「動いてる」と 数字が正しいは別）
if (Q.get('dev') === '1') {
  window.drawMapOverlap = () => drawMap._overlap; window.dbg = () => ({ G, CITIES, dbgDraw: drawMap, GOODS, NATIONS, ROADS, roadOf, price, linked, travel, trade, act,
    RAIL_PROJECTS, buildRail, clearBuiltRails, roadsBetween, roadFee, saveGame, loadGame, readSave, clearSave, paintSlots, SLOTS, slotKey, get curSlot() { return curSlot; }, set curSlot(v) { curSlot = v; },
    specialty, companyNations, cargoCount, cityById,
    LAND_COST, FARM_COST, FACTORY_COST, MARKET_COST, MARKET_MUL, SIZE_NAME, CARGO_MAX, START_MONEY, BUILD, render,
    STATION_COST, STATION_INCOME, hasRail, stationIncome });
}
// ⏳ 落とすものが無いゲーム＝共通の「よみこみ中」を 一呼吸（0.8秒）だけ出して閉じる（3本の入り口をそろえる・パパ9/10）
if (window.YuLoad) YuLoad.done();
</script>
