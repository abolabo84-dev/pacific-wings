<script>
const BUILD = 'koeki-0909f';   // ⚠ 版の印
document.getElementById('buildTag').textContent = BUILD;
const Q = new URLSearchParams(location.search);

// ============ ログ計装（常時ON・パパ方針「テストプレイは全部データ」）============
const LOG_TAG = Q.get('tag') || 'koeki';
const STARTED = new Date().toISOString();
const LOG_KEY = 'yuujinKoekiLog_' + STARTED.replace(/[:.]/g, '-') + '_' + LOG_TAG;
const gameLog = [];
function logEvent(type, data) { gameLog.push({ t: Math.round(performance.now()), type, data }); }
function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify({ ver: location.pathname, tag: LOG_TAG, started: STARTED, events: gameLog.slice(-3000) })); }
  catch (e) { console.warn('⚠ ログを保存できなかった', e); }
}
setInterval(saveLog, 10000);
addEventListener('beforeunload', saveLog);
window.gameLog = gameLog;
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyMDP1lVKD7YRe3A0Z37qr9W6fMOcIyPiy-c_d2kZs1ywQCeeBrwLz7sm6-5tKqYomX/exec';
if (!localStorage.getItem('yuujinDevice')) localStorage.setItem('yuujinDevice', 'pc-' + Math.random().toString(36).slice(2, 7));
if (!localStorage.getItem('yuujinWord')) {
  const B = ['ねこ','いぬ','くじら','さめ','かめ','たか','わし','ぺんぎん','らっこ','きつね'];
  localStorage.setItem('yuujinWord', B[Math.floor(Math.random()*B.length)] + (100 + Math.floor(Math.random()*900)));
}
document.getElementById('titleWord').textContent = localStorage.getItem('yuujinWord');
let sentCount = 0, sending = false;
async function sendLog() {
  if (sending || sentCount >= gameLog.length) return;
  sending = true;
  const upto = gameLog.length;
  try {
    const res = await fetch(CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ key: 'yuujin2026', runId: LOG_KEY, device: localStorage.getItem('yuujinDevice'),
        ver: location.pathname, tag: LOG_TAG, build: BUILD, word: localStorage.getItem('yuujinWord'),
        nation: G.nation ? G.nation.id : '', events: gameLog.slice(sentCount, upto) }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    sentCount = upto;
  } catch (e) { console.warn('⚠ ログを送れなかった。次の60秒でまた試す', e); }
  finally { sending = false; }
}
setInterval(sendLog, 60000);
addEventListener('beforeunload', () => {
  if (sentCount < gameLog.length)
    navigator.sendBeacon(CLOUD_URL, new Blob([JSON.stringify({ key: 'yuujin2026', runId: LOG_KEY,
      device: localStorage.getItem('yuujinDevice'), ver: location.pathname, tag: LOG_TAG, build: BUILD,
      events: gameLog.slice(sentCount) })], { type: 'text/plain' }));
});
logEvent('open', { ua: navigator.userAgent, w: innerWidth, h: innerHeight });

// ============ 監督の確定仕様（9/9「交易物語」）============
// 「まず最初に世界地図が出てきて海が無くても陸で動ける」「世界地図で自分は、どこの国か選べる」
// 「どんどんいろんな国に自分の会社お作る」「土地も買えるし工場も市場も作れる駄々しお金があれば」
// 「ゲームの核は、お金で買えること」「１８８７年」
// 参考（パパ）：東インド会社ボドゲ＝安く買って高く売る・株価変動
// 11か国は 陸上戦と同じ（監督8/25の並びのまま）
const NATIONS = [
  { id:'jp', name:'日本',     color:'#e53935', city:'東京' },
  { id:'gb', name:'イギリス', color:'#1e88e5', city:'ロンドン' },
  { id:'de', name:'ドイツ',   color:'#546e7a', city:'ベルリン' },
  { id:'in', name:'インド',   color:'#fb8c00', city:'ボンベイ' },
  { id:'ru', name:'ロシア',   color:'#8e24aa', city:'モスクワ' },
  { id:'fr', name:'フランス', color:'#29b6f6', city:'パリ' },
  { id:'it', name:'イタリア', color:'#43a047', city:'ローマ' },
  { id:'cn', name:'中国',     color:'#d81b60', city:'北京' },
  { id:'nl', name:'オランダ', color:'#fdd835', city:'アムステルダム' },
  { id:'pt', name:'ポルトガル', color:'#00897b', city:'リスボン' },
  { id:'es', name:'スペイン', color:'#c62828', city:'マドリード' },
];
// 商品。産地では安い＝はこぶと もうかる（地域差が交易の動機・監督8/25の構造そのまま）
const GOODS = [
  { id:'tea',  name:'茶',  icon:'🍵', base:22 },
  { id:'silk', name:'絹',  icon:'🎀', base:36 },
  { id:'cot',  name:'綿',  icon:'🧶', base:16 },
  { id:'iron', name:'鉄',  icon:'⚙', base:26 },
  // ☕ 監督9/9 22:14「コーヒーを入れる」。⚠ ブラジルは1850年ごろ生産世界一＝リオが産地（史実）
  { id:'cof',  name:'コーヒー', icon:'☕', base:20 },
];
// 世界地図の街。mult=その街の値段のくせ（1より小さい＝安い産地）。⚠ 地図の絵は簡単に、
// 「どこで安く どこで高いか」の**構造**を本物にする（それが交易ゲームの核だから）
const CITIES = [
  { id:'london', name:'ロンドン',     nat:'gb', x:432, y:148, mult:{tea:1.6, silk:1.5, cot:1.1, iron:0.6, cof:1.4} },
  { id:'amst',   name:'アムステルダム', nat:'nl', x:472, y:138, mult:{tea:1.4, silk:1.3, cot:1.0, iron:0.9, cof:1.3} },
  { id:'paris',  name:'パリ',         nat:'fr', x:458, y:178, mult:{tea:1.3, silk:1.7, cot:1.0, iron:0.9, cof:1.4} },
  { id:'berlin', name:'ベルリン',     nat:'de', x:508, y:150, mult:{tea:1.3, silk:1.2, cot:1.3, iron:0.7, cof:1.4} },
  { id:'rome',   name:'ローマ',       nat:'it', x:505, y:212, mult:{tea:1.2, silk:1.1, cot:0.9, iron:1.1, cof:1.3} },
  { id:'madrid', name:'マドリード',   nat:'es', x:420, y:215, mult:{tea:1.2, silk:1.2, cot:0.9, iron:1.2, cof:1.2} },
  { id:'lisbon', name:'リスボン',     nat:'pt', x:396, y:222, mult:{tea:1.1, silk:1.2, cot:0.9, iron:1.2, cof:1.1} },
  { id:'moscow', name:'モスクワ',     nat:'ru', x:592, y:118, mult:{tea:1.5, silk:1.3, cot:1.4, iron:0.8, cof:1.5} },   // 茶1.5＝ロシアは茶の大輸入国（キャフタ貿易）
  { id:'cairo',  name:'カイロ',       nat:null, x:552, y:258, mult:{tea:1.0, silk:1.0, cot:0.6, iron:1.3, cof:1.2} },
  { id:'bombay', name:'ボンベイ',     nat:'in', x:688, y:298, mult:{tea:0.8, silk:0.9, cot:0.5, iron:1.4, cof:1.3} },
  { id:'sing',   name:'シンガポール', nat:null, x:762, y:344, mult:{tea:0.8, silk:0.8, cot:0.9, iron:1.4, cof:1.3} },
  { id:'beijing',name:'北京',         nat:'cn', x:800, y:196, mult:{tea:0.5, silk:0.6, cot:1.1, iron:1.5, cof:1.5} },
  { id:'tokyo',  name:'東京',         nat:'jp', x:878, y:206, mult:{tea:0.6, silk:0.5, cot:1.2, iron:1.5, cof:1.6} },
  { id:'ny',     name:'ニューヨーク', nat:null, x:236, y:178, mult:{tea:1.5, silk:1.4, cot:0.8, iron:0.9, cof:0.9} },
  { id:'rio',    name:'リオ',         nat:null, x:308, y:390, mult:{tea:1.3, silk:1.3, cot:0.7, iron:1.4, cof:0.4} },
];
// 道。kind: 'rail'（🚂・1日）／'sea'（🚢・2日）／'camel'（🐫・3日）。
// 🐫はパパの発案（9/9「ほんとはラクダとか むしろおもしろくない？」）＝**史実をそのまま遊びにする**。
//   モスクワ⇔北京は シベリア鉄道がまだ無い（着工1891）ので ラクダのキャラバン＝3日かかる。
//   そのかわり 茶のもうけが大きい（ほんもののキャフタ茶貿易とおなじ理くつ）。
// ⚠ ボンベイ⇔シンガポール等も ほんとうは船の時代なので 海の道に直した（教材ページと合わせる）
const ROADS = [
  ['london','paris','sea',2], ['london','amst','sea',2], ['paris','amst','rail',1],
  ['amst','berlin','rail',1], ['paris','madrid','rail',1], ['madrid','lisbon','rail',1],
  ['paris','rome','rail',1], ['rome','berlin','rail',1], ['berlin','moscow','rail',1],
  ['rome','cairo','sea',2], ['moscow','beijing','camel',3],   // 🐫 ほんものの「茶の道」
  ['cairo','bombay','sea',2], ['bombay','sing','sea',2], ['sing','beijing','sea',2],
  ['beijing','tokyo','sea',2], ['london','ny','sea',2], ['ny','rio','sea',2], ['lisbon','rio','sea',2],
];
const ROAD_ICON = { rail:'🚂', sea:'🚢', camel:'🐫' };
// 🚂 監督9/9 22:28「線路もお金がかかるけど引けたら」＝**線路は 買うもの**（核「お金で買える」）。
//   パパ「シベリア鉄道作る側にもなる的な？」→ 監督「そう 会社で売ったり買ったりできるけど
//   交通も整備したりできる」。
//   史実：シベリア鉄道は1891年着工・全線1916年（25年がかり）。ゲームでは1887年に
//   **じぶんが作る側**になれる＝歴史より4年はやい。それがこのゲームの遊び。
// ponytail: いまはシベリア鉄道1本だけ。監督が「ほかの道も」と言ったら足す
const RAIL_PROJECTS = [
  { a:'moscow', b:'beijing', name:'シベリア鉄道', cost:500, fee:40 },
];

// ⚠ 道は 同じ2つの街のあいだに **何本あってもいい**。
//   （線路を引いても 🐫の道は消さない＝パパ9/9「選択肢として共存できる形をさぐりたい」）
const roadsBetween = (a, b) => ROADS.filter(r => (r[0] === a && r[1] === b) || (r[0] === b && r[1] === a));
const roadOf = (a, b) => roadsBetween(a, b)[0];
// 通行料。⚠ 🐫とお船はタダ。🚂は石炭代がかかる＝**はやいけど お金がへる**。
//   これで「急ぐか、節約するか」を えらべる（どちらかが消えない）
// ⚠ 道が無いところへ動かされることがある（テストや、あとで足す機能）。
//   r が無いのに r[4] を読むと **そこでゲームが止まる**。0を返して先へ進める
const roadFee = r => (r && r[4]) || 0;
// 🏗 建物の大きさ（監督9/9 22:16「最初は小さい工場と小さい茶畑しかない」）。
// ⚠ 「小さい」と言った＝**大きくできる**ということ。監督の核「お金で買える」がここにも効く。
//    小さい(1) → ふつう(2) → 大きい(3)。作る数／売値が 大きさぶん増える
const SIZE_NAME = ['', '小さい', 'ふつうの', '大きい'];
const LAND_COST = 80;
const FARM_COST    = [0, 90, 200, 420];    // 🌱 畑：茶をつくる（監督の「茶畑」）
const FACTORY_COST = [0, 120, 260, 540];   // 🏭 工場：その街の名産をつくる
const MARKET_COST  = [0, 100, 220, 460];   // 🏪 市場：売値が上がる
const MARKET_MUL   = [1, 1.3, 1.5, 1.8];
const CARGO_MAX = 10, START_MONEY = 100;
const cityById = id => CITIES.find(c => c.id === id);
const linked = (a, b) => ROADS.some(r => (r[0] === a && r[1] === b) || (r[0] === b && r[1] === a));

// ============ 状態 ============
const G = { started: false, nation: null, at: null, day: 0, money: START_MONEY,
            cargo: {}, own: {}, msgT: 0, choose: null };
// own[cityId] = { land:true, farm:0, factory:0, market:0, stock:{商品id: 数} }
//   farm/factory/market は **大きさ**（0=無い／1小さい／2ふつう／3大きい）
GOODS.forEach(g => G.cargo[g.id] = 0);
const cargoCount = () => GOODS.reduce((a, g) => a + G.cargo[g.id], 0);
// その街の いちばんの名産（mult最小の商品）＝工場が作るもの
const specialty = c => GOODS.reduce((a, g) => c.mult[g.id] < c.mult[a.id] ? g : a, GOODS[0]);
// 値段。⚠ 「株価変動」（参考ボドゲ）：日ごとに ゆっくり波打つ＋街ごとに位相をずらす。
//    乱数でなく波にする＝「待てば変わる」「よその街は今どうか」を考えられる
function price(c, g, day = G.day) {
  const wave = 1 + 0.22 * Math.sin(day * 0.55 + c.x * 0.05 + GOODS.indexOf(g) * 1.7);
  return Math.max(3, Math.round(g.base * c.mult[g.id] * wave));
}
const companyNations = () => {
  const set = new Set();
  for (const [cid, o] of Object.entries(G.own)) if (o.land) {
    const c = cityById(cid);
    set.add(c.nat || c.id);   // 中立の街（カイロ等）は その街じたいを1つと数える
  }
  return set;
};
const $ = id => document.getElementById(id);
function showMessage(t, sec = 2.2) { $('msg').textContent = t; $('msg').style.opacity = 1; G.msgT = sec;
  clearTimeout(showMessage._t); showMessage._t = setTimeout(() => $('msg').style.opacity = 0, sec * 1000); }

// ============ 世界地図（canvas）============
const cv = $('map'), ctx = cv.getContext('2d');
const MAPW = 1000, MAPH = 470;
function drawMap() {
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  const s = Math.min(w / MAPW, h / MAPH);
  const ox = (w - MAPW * s) / 2, oy = (h - MAPH * s) / 2;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#16324a'; ctx.fillRect(0, 0, w, h);
  const X = c => ox + c.x * s, Y = c => oy + c.y * s;
  // 大陸のかんじ（ざっくりの形。⚠ 正確な地図より「どの街とどの街がつながるか」が本体）
  ctx.fillStyle = '#1f4a33';
  const blobs = [[240,220,90,120],[300,400,70,90],[470,180,110,80],[540,270,70,60],
                 [640,180,180,90],[720,300,90,80],[850,210,60,50]];
  for (const [bx, by, rx, ry] of blobs) {
    ctx.beginPath(); ctx.ellipse(ox + bx*s, oy + by*s, rx*s, ry*s, 0, 0, Math.PI*2); ctx.fill();
  }
  // 道（🚂実線・🚢点線・🐫あらい点線＋ラクダのしるし）
  for (const [a, b, kind] of ROADS) {
    const A = cityById(a), B = cityById(b);
    ctx.strokeStyle = kind === 'rail' ? 'rgba(255,224,130,.6)'
                    : kind === 'camel' ? 'rgba(255,171,64,.75)' : 'rgba(129,212,250,.45)';
    ctx.lineWidth = kind === 'camel' ? 3 : 2;
    ctx.setLineDash(kind === 'sea' ? [6, 5] : kind === 'camel' ? [2, 6] : []);
    ctx.beginPath(); ctx.moveTo(X(A), Y(A)); ctx.lineTo(X(B), Y(B)); ctx.stroke();
    if (kind === 'camel') {
      ctx.setLineDash([]);
      ctx.font = Math.max(12, 15*s) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('🐫', (X(A)+X(B))/2, (Y(A)+Y(B))/2 - 4);
    }
  }
  ctx.setLineDash([]);
  // 街
  for (const c of CITIES) {
    const own = G.own[c.id];
    const here = G.at === c.id;
    const canGo = G.at && linked(G.at, c.id);
    // 🏢 会社（土地）を持つ街には じぶんの国の色の輪 ＝「占領目標」の見た目（監督9/9「入れてほしい」）
    if (own && own.land) {
      ctx.strokeStyle = G.nation.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(X(c), Y(c), 12, 0, Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle = here ? '#ffe066' : canGo ? '#fff' : '#90a4ae';
    ctx.beginPath(); ctx.arc(X(c), Y(c), here ? 8 : 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.max(10, 13*s) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, X(c), Y(c) - 12);
    if (own && own.factory) ctx.fillText('🏭', X(c) + 16, Y(c) + 5);
  }
  // タップ判定用に保存
  drawMap._geo = { s, ox, oy };
}
cv.addEventListener('pointerdown', e => {
  if (!G.started || !drawMap._geo) return;
  const r = cv.getBoundingClientRect();
  const { s, ox, oy } = drawMap._geo;
  const mx = (e.clientX - r.left - ox) / s, my = (e.clientY - r.top - oy) / s;
  let hit = null, hd = 26;
  for (const c of CITIES) { const d = Math.hypot(c.x - mx, c.y - my); if (d < hd) { hd = d; hit = c; } }
  if (!hit) return;
  if (hit.id === G.at) return;
  const rs = roadsBetween(G.at, hit.id);
  if (!rs.length) { showMessage('⚠ ' + hit.name + 'へは 道がつながってない', 1.6); return; }
  if (rs.length === 1) { travel(hit, rs[0]); return; }
  // ⚠ 道が2本あるときは **えらばせる**。かってに はやいほうを使うと、
  //   「線路を引いた意味」も「ラクダのほうが得な時がある」も 分からなくなる
  G.choose = { city: hit, roads: rs };
  render();
});

// ============ すすむ ============
function travel(c, road) {
  road = road || roadOf(G.at, c.id);
  const days = road ? road[3] : 1;
  const fee = roadFee(road);
  if (fee > G.money) { showMessage('⚠ 石炭代（' + fee + '）が たりない', 1.8); return; }
  G.money -= fee;
  G.at = c.id; G.day += days;
  // 🌱🏭 畑と工場は 行ってない街でも 毎日つくる。⚠ 3日の道なら 3日ぶん、大きさぶん たまる
  for (const [cid, o] of Object.entries(G.own)) {
    o.stock = o.stock || {};
    if (o.farm) o.stock.tea = Math.min(30, (o.stock.tea || 0) + o.farm * days);
    if (o.factory) {
      const sp2 = specialty(cityById(cid));
      o.stock[sp2.id] = Math.min(30, (o.stock[sp2.id] || 0) + o.factory * days);
    }
  }
  logEvent('travel', { to: c.id, day: G.day, days, kind: road ? road[2] : '?', fee, money: G.money });
  const icon = road ? ROAD_ICON[road[2]] : '🧳';
  showMessage(icon + ' ' + days + '日かけて ' + c.name + 'に ついた' + (fee ? '（石炭 -' + fee + '）' : ''), 1.6);
  render();
}
function dateStr() {
  // 1887年1月1日から 1日ずつ。⚠ 監督「１８８７年」＝年は画面にいつも出す
  const d = new Date(1887, 0, 1); d.setDate(d.getDate() + G.day);
  return '1887年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

// ============ 画面 ============
function render() {
  drawMap();
  $('hudDate').textContent = '📅 ' + dateStr();
  $('hudMoney').textContent = '💰 ' + G.money;
  $('hudCo').textContent = '🏢 ' + companyNations().size + 'か国';
  const c = cityById(G.at);
  const own = G.own[c.id] || {};
  const sp = specialty(c);
  let h = '<h2>📍 ' + c.name + (c.nat ? '（' + NATIONS.find(n => n.id === c.nat).name + '）' : '') + '</h2>';
  h += '<div class="sub">名産は ' + sp.icon + sp.name + '。にもつ ' + cargoCount() + '/' + CARGO_MAX + '</div>';
  // たてもの（監督「土地も買えるし工場も市場も作れる駄々しお金があれば」＋9/9「最初は小さい〜」）
  // ⚠ **いまの大きさと つぎの値段を いつも見せる**。見えないと お金をためる理由が分からない
  let bh = '<div class="row">';
  if (!own.land) bh += '<button class="build" data-act="land"' + (G.money < LAND_COST ? ' disabled' : '') + '>🏢 土地を買う（' + LAND_COST + '）</button>';
  else {
    bh += '<span>🏢 会社あり</span>';
    const one = (key, icon, name, costs, extra) => {
      const lv = own[key] || 0;
      let t = '';
      if (lv > 0) t += '<span>' + icon + ' ' + SIZE_NAME[lv] + name + (extra ? '（' + extra(lv) + '）' : '') + '</span>';
      if (lv < 3) t += '<button class="build" data-act="' + key + '"' + (G.money < costs[lv+1] ? ' disabled' : '') + '>' +
        icon + (lv === 0 ? ' ' + name + 'を作る' : ' 大きくする') + '（' + costs[lv+1] + '）→' + SIZE_NAME[lv+1] + name + '</button>';
      return t;
    };
    bh += one('farm', '🌱', '茶畑', FARM_COST, lv => '1日に🍵' + lv);
    bh += one('factory', '🏭', '工場', FACTORY_COST, lv => '1日に' + sp.icon + lv);
    bh += one('market', '🏪', '市場', MARKET_COST, lv => '売値' + MARKET_MUL[lv] + '倍');
    const st = own.stock || {};
    const total = Object.values(st).reduce((a2, b2) => a2 + b2, 0);
    if (total > 0) bh += '<button class="build" data-act="collect">📦 回収（' +
      Object.entries(st).filter(x => x[1] > 0).map(x => (GOODS.find(y => y.id === x[0]) || {}).icon + x[1]).join(' ') + '）</button>';
  }
  bh += '</div>';
  h += '<table>';
  for (const g of GOODS) {
    const p = price(c, g), py = price(c, g, G.day - 1);
    const arrow = p > py ? '<span class="up">▲</span>' : p < py ? '<span class="down">▼</span>' : '・';
    const sellP = Math.round(p * MARKET_MUL[own.market || 0]);
    h += '<tr><td>' + g.icon + ' ' + g.name + '（もってる ' + G.cargo[g.id] + '）</td>' +
      '<td class="num">' + p + ' ' + arrow + '</td>' +
      '<td><button class="buy" data-buy="' + g.id + '"' + (G.money < p || cargoCount() >= CARGO_MAX ? ' disabled' : '') + '>買う</button>' +
      '<button class="sell" data-sell="' + g.id + '"' + (G.cargo[g.id] <= 0 ? ' disabled' : '') + '>売る ' + sellP + '</button></td></tr>';
  }
  h += '</table>';
  // 🛤 道が2本あるとき：どっちで行くかを えらぶ
  if (G.choose) {
    h += '<div class="row" style="background:#1b3a2a;border-radius:9px;padding:6px;margin:4px 0">' +
      '<b>' + G.choose.city.name + 'へ どっちで行く？</b>';
    G.choose.roads.forEach((r, i) => {
      const fee = roadFee(r);
      h += '<button class="build" data-go="' + i + '">' + ROAD_ICON[r[2]] + ' ' + r[3] + '日' +
        (fee ? '（石炭 ' + fee + '）' : '（タダ）') + '</button>';
    });
    h += '<button data-go="x">やめる</button></div>';
  }
  h += bh;
  // 🚂 線路を引く（この街から出ている 🐫の道があるとき）
  for (const rp of RAIL_PROJECTS) {
    if (c.id !== rp.a && c.id !== rp.b) continue;
    if (roadsBetween(rp.a, rp.b).some(r => r[2] === 'rail')) continue;   // もう引いてあれば出さない
    h += '<div class="row"><button class="build" data-rail="' + rp.a + ':' + rp.b + '"' +
      (G.money < rp.cost ? ' disabled' : '') + '>🚂 ' + rp.name + 'を引く（' + rp.cost + '）' +
      '🐫3日タダ の となりに 🚂1日(石炭' + rp.fee + ')が できる</button></div>';
  }

  h += '<div class="sub" style="margin-top:6px">🗺 地図の 白い街を おすと すすむ。' +
       '🚂鉄道=1日・🚢船=2日・🐫キャラバン=3日。道が2本あるときは えらべる</div>';
  $('panel').innerHTML = h;
  for (const b of $('panel').querySelectorAll('[data-buy]')) b.onclick = () => trade(b.dataset.buy, +1);
  for (const b of $('panel').querySelectorAll('[data-sell]')) b.onclick = () => trade(b.dataset.sell, -1);
  for (const b of $('panel').querySelectorAll('[data-act]')) b.onclick = () => act(b.dataset.act);
  for (const b of $('panel').querySelectorAll('[data-rail]')) b.onclick = () => buildRail(b.dataset.rail);
  for (const b of $('panel').querySelectorAll('[data-go]')) b.onclick = () => {
    const ch = G.choose; G.choose = null;
    if (b.dataset.go === 'x' || !ch) { render(); return; }
    travel(ch.city, ch.roads[+b.dataset.go]);
  };
}
function trade(gid, dir) {
  const c = cityById(G.at), g = GOODS.find(x => x.id === gid);
  const own = G.own[c.id] || {};
  if (dir > 0) {
    const p = price(c, g);
    if (G.money < p || cargoCount() >= CARGO_MAX) return;
    G.money -= p; G.cargo[gid]++;
    logEvent('buy', { g: gid, p, at: c.id });
  } else {
    if (G.cargo[gid] <= 0) return;
    const p = Math.round(price(c, g) * MARKET_MUL[own.market || 0]);
    G.money += p; G.cargo[gid]--;
    logEvent('sell', { g: gid, p, at: c.id });
  }
  render();
}
function act(kind) {
  const c = cityById(G.at);
  const own = G.own[c.id] = G.own[c.id] || { land: false, farm: 0, factory: 0, market: 0, stock: {} };
  const COSTS = { farm: FARM_COST, factory: FACTORY_COST, market: MARKET_COST };
  const ICONS = { farm: '🌱', factory: '🏭', market: '🏪' };
  const NAMES = { farm: '茶畑', factory: '工場', market: '市場' };
  if (kind === 'land' && !own.land && G.money >= LAND_COST) {
    G.money -= LAND_COST; own.land = true;
    const n = companyNations().size;
    showMessage('🏢 ' + c.name + 'に 会社をつくった！（' + n + 'か国め）', 2.4);
    logEvent('land', { at: c.id, nations: n });
    if (n === 5) { showMessage('🎉 5か国に 会社ができた！ りっぱな商人だ！', 3.5); logEvent('five_nations', {}); }
  } else if (COSTS[kind] && own.land) {
    const lv = own[kind] || 0;
    if (lv >= 3 || G.money < COSTS[kind][lv+1]) return;
    G.money -= COSTS[kind][lv+1]; own[kind] = lv + 1;
    showMessage(ICONS[kind] + ' ' + SIZE_NAME[lv+1] + NAMES[kind] + 'に なった！', 2.2);
    logEvent(kind, { at: c.id, lv: lv + 1 });
  } else if (kind === 'collect') {
    const st = own.stock || {};
    let took = 0; const names = [];
    for (const g of GOODS) {
      const have = st[g.id] || 0;
      if (have <= 0) continue;
      const take = Math.min(have, CARGO_MAX - cargoCount());
      if (take <= 0) break;
      st[g.id] -= take; G.cargo[g.id] += take; took += take; names.push(g.icon + take);
    }
    if (took === 0) { showMessage('⚠ にもつが いっぱい', 1.4); return; }
    showMessage('📦 ' + names.join(' ') + ' 回収した', 1.8);
    logEvent('collect', { at: c.id, n: took });
  }
  render();
}

// 🚂 線路を引く。⚠ ROADS の中身を書きかえる＝地図も日数も そのまま新しくなる
//   （別の場所に「引いた印」を持つと、地図と日数が古いまま残る事故になる）
function buildRail(key) {
  const [ra, rb] = key.split(':');
  const rp = RAIL_PROJECTS.find(x => x.a === ra && x.b === rb);
  if (!rp || roadsBetween(ra, rb).some(r => r[2] === 'rail') || G.money < rp.cost) return;
  G.money -= rp.cost;
  // ⚠⚠ 前は 🐫の道を 🚂に**書きかえて**いた＝せっかくの「遠くて もうかる道」が消えた。
  //   パパ9/9「選択肢として共存できる形をさぐりたい」→ **2本目の道として足す**。
  //   🐫3日タダ ／ 🚂1日だけど石炭代。どっちで行くかを えらべるようになる
  ROADS.push([rp.a, rp.b, 'rail', 1, rp.fee]);
  // ⚠ 引くと 🐫の道が 地図から消える。それは「史実が消えた」のではなく
  //   **ゆうじんが歴史を作った**ということ。そう言わないと ただ道が変わっただけに見える
  showMessage('🚂 ' + rp.name + ' かんせい！ ほんものより4年はやい！ ' +
    '🐫3日タダ と 🚂1日(石炭' + rp.fee + ') どっちでも行ける', 4.4);
  logEvent('rail', { name: rp.name, cost: rp.cost, day: G.day });
  render();
}

// ============ タイトル ============
let pickNat = 0;
const natRow = $('natRow');
NATIONS.forEach((n, i) => {
  const b = document.createElement('button');
  b.textContent = n.name;
  b.style.borderColor = n.color;
  b.className = i === pickNat ? 'on' : '';
  b.onclick = () => { pickNat = i; logEvent('pick_nation', { id: n.id });
    for (const x of natRow.children) x.className = ''; b.className = 'on'; };
  natRow.appendChild(b);
});
$('go').onclick = () => {
  G.nation = NATIONS[pickNat];
  const home = CITIES.find(c => c.nat === G.nation.id);
  G.at = home.id; G.started = true;
  // 🌱🏭 監督9/9「最初は小さい工場と小さい茶畑しかない」＝**持ち物ゼロではない**。
  //   小さいのが2つだけある所から始めて、お金で大きくしていく（核＝お金で買える）
  G.own[home.id] = { land: true, farm: 1, factory: 1, market: 0, stock: {} };
  $('overlay').style.display = 'none';
  showMessage('🧳 ' + home.name + 'から出発！ 小さい工場と 小さい茶畑しかない', 3.4);
  logEvent('start', { nation: G.nation.id, home: home.id });
  render();
};
addEventListener('resize', () => { if (G.started) drawMap(); });

// ?dev=1：外から数字を見る口（⚠ 目で「動いてる」と 数字が正しいは別）
if (Q.get('dev') === '1') {
  window.dbg = () => ({ G, CITIES, GOODS, NATIONS, ROADS, roadOf, price, linked, travel, trade, act,
    RAIL_PROJECTS, buildRail, roadsBetween, roadFee,
    specialty, companyNations, cargoCount, cityById,
    LAND_COST, FARM_COST, FACTORY_COST, MARKET_COST, MARKET_MUL, SIZE_NAME, CARGO_MAX, START_MONEY, BUILD, render });
}
</script>
