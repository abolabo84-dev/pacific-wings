<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>江戸の町体験 試作2</title>
<!-- 🏮 監督の 新しいゲーム「江戸の町体験」（11/4〜11/8 の SMS）。11/22「ぜんぶ」→ パパ「作りはじめてええ」で 最初の 一歩だけ 形にした。
     入っているもの：性別と 名前 → 五文で 家を 買う → 回覧板 → ウナギ屋（タレを かける ミニゲーム）→ 食べる（5日 食べないと 最初から）→ 物知りな じいさん
     ⚠ まだ ない：ほかの 仕事・mob 百人・富くじ・旅・奉行と 侍・吉原・ばくち・粋と 徳・落語の 噺・みんなでルーム（1つずつ 足す）
     🚶 試作2（11/22）：監督 19:39「1 A」＝「三国志合戦みたいに、自分で町を歩く」→ 町を 3D で 歩いて、戸口で「入る」と 今までの 札が 出る。中身（お金・家・仕事・食べる）は 試作1の まま
        操作は 三国志合戦と 同じ（左右で 向き・前後で 歩く）。3D が 動かない 端末では 試作1の ボタンの 画面に なる（body.t3d が 付かない）
     ponytail: ひとりだけ・仕事は ウナギ屋 1つ・町は 通り 1本・建物の 中は ない（戸口で 札）・mob なし, 監督が 順番を 決めたら 1つずつ 足す -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1410; color: #fff; font-family: "Meiryo", "Hiragino Sans", sans-serif;
               touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  body { overflow: hidden; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 12px 16px 24px; }
  .screen.on { display: flex; }
  h1 { font-size: clamp(24px, 7vw, 38px); margin: 14px 0 2px; text-align: center; text-shadow: 2px 2px 4px #000; }
  h2 { font-size: clamp(17px, 4.5vw, 24px); margin: 12px 0 6px; text-align: center; }
  p.sub { font-size: 14px; opacity: .8; text-align: center; margin: 2px 0 8px; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(100%, 560px); margin: 6px 0; }
  /* ⚠ 子どもの指は 大人より 大きい的が 要る（群雄合戦と 同じ：どのボタンも 52px 以上） */
  button { font-family: inherit; font-weight: bold; color: #fff; cursor: pointer; border: 3px solid #fff; border-radius: 12px;
           background: #5a3a22; min-height: 52px; padding: 8px 14px; font-size: 17px; text-shadow: 1px 1px 2px #000; }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .35; }
  .pick { opacity: .55; border-width: 2px; }
  .pick.on { opacity: 1; border-color: #ffe066; box-shadow: 0 0 10px #ffe066; }
  .hint { font-size: 14px; opacity: .9; text-align: center; margin: 4px 0; line-height: 1.6; max-width: 560px; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; text-align: center; }
  input[type=text] { font-family: inherit; font-size: 20px; padding: 8px 10px; border-radius: 8px; border: 2px solid #c9a86a;
           background: #fff8e8; color: #222; width: min(100%, 320px); -webkit-user-select: text; user-select: text; }
  #go { background: #8a2f1b; font-size: 22px; padding: 12px 34px; margin-top: 14px; }

  #town { padding: 0; }
  #top { width: 100%; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; padding: 8px; background: #2e2114; font-size: 17px; font-weight: bold; }
  #top .me { color: #ffe066; }
  #top .warn { color: #ff8a80; }
  #scene { width: 100%; flex: 0 0 auto; text-align: center; font-size: 44px; padding: 14px 0 8px; background: linear-gradient(#27364a, #3b2a1c); letter-spacing: .12em; }
  #news { width: 100%; flex: 1 1 auto; min-height: 90px; overflow-y: auto; background: #120e0a; padding: 6px 10px; font-size: 15px; line-height: 1.6; }
  #news div { border-bottom: 1px solid #2c2318; padding: 2px 0; }
  #news .good { color: #b9f6ca; } #news .bad { color: #ff8a80; } #news .k { color: #ffe066; }
  #cmd { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; background: #2e2114; }
  #cmd button { font-size: 17px; min-height: 56px; }

  #sheet { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 30; }
  #sheet.on { display: flex; align-items: flex-end; justify-content: center; }
  #sheetBox { width: min(100%, 620px); max-height: 88%; overflow-y: auto; background: #3a2a18; border: 3px solid #c9a86a; border-bottom: 0;
              border-radius: 16px 16px 0 0; padding: 12px 14px 20px; }
  #sheetBox .row { width: 100%; }
  #sheetBox .row button { flex: 1 1 100%; text-align: left; }
  #sheetBox .row.two button { flex: 1 1 40%; text-align: center; }
  .cost { color: #ffe066; }

  #work { background: #241a12; }
  #cv { display: block; touch-action: none; border-radius: 14px; background: #3b2a1c; margin-top: 6px; }
  #bar { width: min(100%, 420px); height: 14px; border-radius: 7px; background: #111; margin-top: 8px; overflow: hidden; }
  #barIn { height: 100%; width: 100%; background: #ffb300; }
  #wMsg { font-size: 22px; font-weight: bold; min-height: 1.6em; margin-top: 8px; text-align: center; }
  /* ---- 🚶 3D の 町（body.t3d が 付いたときだけ。付かなければ 試作1の ボタン画面） ---- */
  #view, #stick, #act, #next, #keyHint { display: none; }
  body.t3d #scene, body.t3d #cmd { display: none; }
  body.t3d #view { display: block; position: absolute; inset: 0; z-index: 0; }
  body.t3d #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  body.t3d #top { position: relative; z-index: 5; background: rgba(46,33,20,.82); }
  body.t3d #news { position: relative; z-index: 5; flex: 0 0 auto; min-height: 0; max-height: 4.9em; overflow: hidden; background: rgba(0,0,0,.45); pointer-events: none; }
  body.t3d #next { display: block; position: relative; z-index: 5; margin-top: 6px; padding: 4px 12px; border-radius: 10px; background: rgba(0,0,0,.55);
                   color: #ffe066; font-weight: bold; font-size: 17px; text-align: center; pointer-events: none; }
  /* 🕹 11/22 の 本番ログ（スマホ 375×640）：始めて すぐ 画面の まんなかを 5秒で 7回 押し、歩けたのは 80秒後。そのあとも スティックの すぐ 右（x 200〜218）を 押して 外していた
     → スティックの 場所を 左下に いつも 見せる・さわれる 所を 横 50%→58% に */
  body.t3d #stick { display: block; position: absolute; left: 0; bottom: 0; width: 58%; height: 50%; z-index: 11; touch-action: none; }
  #stickHint { display: none; position: absolute; left: 28px; bottom: 64px; width: 110px; height: 110px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75);
               background: rgba(0,0,0,.28); z-index: 10; pointer-events: none; }
  #stickHint::after { content: ''; position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); }
  #stickHint span { position: absolute; left: -10px; bottom: 118px; width: 160px; text-align: center; font-weight: bold; font-size: 16px; color: #ffe066; text-shadow: 1px 1px 3px #000; line-height: 1.3; }
  body.t3d.touch #town.on ~ #stickHint, body.t3d.touch #stickHint.show { display: block; }
  body.t3d.touch.walking #stickHint { opacity: .35; }
  body.t3d.touch.walking #stickHint span, body.stickdown #stickHint { display: none !important; }
  #stickBase { position: fixed; width: 110px; height: 110px; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; display: none; pointer-events: none; z-index: 12; }
  #stickKnob { position: fixed; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); display: none; pointer-events: none; z-index: 12; }
  body.t3d #act { position: absolute; right: 14px; bottom: 28px; z-index: 12; min-height: 76px; min-width: 150px; max-width: 46%; font-size: 19px; background: #8a2f1b; border-color: #ffe066; }
  body.t3d #act.on { display: block; }
  body.t3d #call { position: absolute; right: 14px; bottom: 118px; z-index: 12; min-height: 64px; min-width: 150px; max-width: 46%; font-size: 18px; background: #35507a; border-color: #fff; display: none; }
  body.t3d #call.on { display: block; }
  body.t3d #keyHint { display: block; position: absolute; left: 0; right: 0; bottom: 6px; z-index: 4; text-align: center; font-size: 13px; opacity: .85; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  body.t3d.touch #keyHint { display: none; }
  /* ================= 🎨 画面（11/23 パパ「がめん、こうみると雑然としてるな　もっとスタイリッシュにウィンドウとかもしていきたいな」） =================
     共通の 直し（どの 案でも 同じ）＋ 見た目の 案 ui1／ui2／ui3（?ui= で 切りかえ・パパが 選ぶまで 仮） */
  .say { font-size: 17px; text-align: left; } .say.c { text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #top .me { max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #top .pip { display: inline-block; width: 9px; height: 11px; margin-left: 2px; border-radius: 2px; background: #6fbf73; vertical-align: -1px; }
  #top .pip.e { background: rgba(255,255,255,.18); } #top .warn .pip:not(.e) { background: #ff7a66; }
  /* 3D の とき：左上の 小さな 札（1行目＝名前と 日・2行目＝お金と おなか・3行目＝家と 仕事の 絵） */
  body.t3d #top { position: absolute; left: 8px; top: 8px; width: auto; max-width: calc(100% - 16px); display: grid; grid-template-columns: auto auto; gap: 2px 10px;
                  padding: 7px 12px; border-radius: 12px; font-size: 14px; justify-content: start; }
  body.t3d #top > span, body.t3d.ui2 #top > span, body.t3d.ui3 #top > span { white-space: nowrap; background: none; border: 0; padding: 0; }
  body.t3d.ui2 #top { border: 1px solid var(--gold); background: rgba(14,10,8,.86); }
  body.t3d.ui3 #top { border: 2px solid var(--sumi); }
  body.t3d #news { margin-top: 84px; }
  body.t3d #news { height: 2.3em; max-height: none; overflow: hidden; background: none; text-align: center; padding: 4px 8px 0; }
  body.t3d #news div { display: none; }
  body.t3d #news div:first-child { display: inline-block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0;
                                   padding: 4px 14px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: 14px; transition: opacity .6s; }
  body.t3d #news div.old { opacity: 0; }
  body.t3d #next { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 5px 14px 5px 8px; border-radius: 999px; margin-top: 2px; max-width: calc(100% - 24px); }
  #nextT { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #compass { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; background: #ffe066; color: #1a1410; font-size: 16px; flex: 0 0 auto; }
  body.t3d #act, body.t3d #call { white-space: nowrap; max-width: calc(100% - 28px); min-height: 56px; padding: 10px 20px; border-radius: 999px; font-size: clamp(15px, 4.4vw, 18px); }
  body.t3d #act { bottom: 26px; }
  body.t3d #call { bottom: 96px; }
  #stickHint { bottom: 40px; }
  #place { display: none; }
  body.t3d #place { display: block; position: relative; z-index: 5; margin-top: 4px; padding: 2px 12px; border-radius: 999px; font-size: 13px; background: rgba(0,0,0,.45); pointer-events: none; }
  body.t3d #place:empty { display: none; }
  body.ui3.t3d #place { background: rgba(243,234,216,.9); color: #2a2520; }

  /* ---- 案 2：漆（黒い 漆に 金の 細い 線・見出しは 明朝） ---- */
  body.ui2 { --pan: rgba(18,14,12,.9); --gold: #c9a24a; --ink: #f4ead7; }
  body.ui2 h1, body.ui2 h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; letter-spacing: .06em; }
  body.ui2 button { border: 1px solid var(--gold); background: linear-gradient(#3a2a1c, #22180f); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.4); text-shadow: none; color: var(--ink); }
  body.ui2 #go, body.ui2.t3d #act { background: linear-gradient(#9c3424, #6e2014); border-color: #e8c27a; }
  body.ui2.t3d #call { background: linear-gradient(#2f4766, #1c2d45); }
  body.ui2 #top { background: linear-gradient(rgba(14,10,8,.92), rgba(14,10,8,.75)); border-bottom: 1px solid var(--gold); }
  body.ui2 #top > span { background: none; border: 1px solid rgba(201,162,74,.45); }
  body.ui2.t3d #next { background: var(--pan); border: 1px solid var(--gold); color: #ffe7a8; }
  body.ui2 #sheet { background: rgba(0,0,0,.4); -webkit-backdrop-filter: blur(1.5px); backdrop-filter: blur(1.5px); }
  body.ui2 #sheet.on { align-items: flex-end; }
  body.ui2 #sheetBox { margin: 0 10px 12px; width: min(calc(100% - 20px), 600px); background: var(--pan); border: 1px solid var(--gold); border-radius: 16px;
                       box-shadow: 0 0 0 4px rgba(201,162,74,.12), 0 12px 36px rgba(0,0,0,.6); padding: 14px 16px 18px; color: var(--ink); }
  body.ui2 #sheetBox h2 { margin: 2px 0 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(201,162,74,.5); color: #ffe7a8; }
  body.ui2 #sheetBox .row button { border-radius: 10px; }

  /* ---- 案 3：和紙（生成りの 紙・墨の 字・朱の ボタン） ---- */
  body.ui3 { --paper: #f3ead8; --sumi: #2a2520; --shu: #b8432c; }
  body.ui3 h1, body.ui3 h2 { font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; }
  body.ui3 #top { background: rgba(243,234,216,.94); color: var(--sumi); border-bottom: 2px solid var(--sumi); }
  body.ui3 #top > span { background: rgba(42,37,32,.07); }
  body.ui3 #top .me { color: var(--shu); }
  body.ui3 #top .warn { color: #c0281a; }
  body.ui3.t3d #news div:first-child { background: rgba(243,234,216,.92); color: var(--sumi); }
  body.ui3.t3d #news .good { color: #1e6b3a; } body.ui3.t3d #news .bad { color: #a8241a; } body.ui3.t3d #news .k { color: #6b4a10; }
  body.ui3.t3d #next { background: rgba(243,234,216,.94); color: var(--sumi); border: 2px solid var(--sumi); }
  body.ui3 #compass { background: var(--shu); color: #fff; }
  body.ui3 button { background: var(--paper); color: var(--sumi); border: 2px solid var(--sumi); text-shadow: none; box-shadow: 2px 3px 0 rgba(42,37,32,.35); }
  body.ui3 button:disabled { opacity: .4; }
  body.ui3 #go, body.ui3.t3d #act { background: var(--shu); color: #fff; border-color: #6e1f12; }
  body.ui3.t3d #call { background: #34495e; color: #fff; }
  body.ui3 #sheet { background: rgba(20,16,12,.35); }
  body.ui3 #sheetBox { margin: 0 10px 12px; width: min(calc(100% - 20px), 600px); background: var(--paper); color: var(--sumi); border: 2px solid var(--sumi); border-radius: 6px;
                       box-shadow: 6px 6px 0 rgba(42,37,32,.35); padding: 14px 16px 18px; }
  body.ui3 #sheetBox h2 { margin: 2px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--shu); }
  body.ui3 #sheetBox .cost { color: var(--shu); }
  body.ui3 .hint b { color: var(--shu); }
  /* 👤 札（ウィンドウ）の 下に かくれた 人を シルエットで 見せる（パパ 11/23「ウィンドウで人が隠れてるところはシルエットで表現」）。札より 上・さわれない */
  #silCv { position: fixed; inset: 0; z-index: 31; pointer-events: none; opacity: .9; }
  #mapInfo { display: none; margin-top: 18px; font-size: 14px; min-height: 52px; padding: 6px 14px; opacity: .85; }
  #netB { display: none; }
  body.t3d #netB { display: block; position: absolute; right: 8px; top: 8px; z-index: 6; width: auto; min-width: 52px; min-height: 52px; margin: 0; padding: 4px 10px; border-radius: 999px; font-size: 18px; background: rgba(14,10,8,.86); border: 1px solid #c9a24a; color: #ffe7a8; }
  #ver { position: absolute; right: 6px; bottom: 4px; font-size: 10px; opacity: .4; pointer-events: none; }
</style>
</head>
<body>

<div id="start" class="screen on">
  <h1>🏮 江戸の町体験</h1>
  <p class="sub">🧪 試作2（町を 歩ける。まだ ウナギ屋の 仕事だけ）</p>
  <p class="hint">さいしょは <b>五文</b>。まず 家を 買って、仕事で お金を ためよう。</p>
  <label for="nm">なまえ</label>
  <input type="text" id="nm" maxlength="10" placeholder="れい：くまごろう">
  <label>せいべつ</label>
  <div class="row" id="sexRow">
    <button class="pick on" data-s="男">男</button>
    <button class="pick" data-s="女">女</button>
  </div>
  <button id="go">はじめる</button>
  <button id="cont" style="display:none;margin-top:10px">📂 つづきから</button>
  <button id="mapInfo" onclick="mapInfo()">📜 この 町の 地図に ついて</button>
  <button id="bRoom" onclick="roomSheet()" style="margin-top:10px">👥 みんなで あそぶ</button>
</div>

<div id="town" class="screen">
  <div id="top"></div>
  <div id="view"></div>
  <div id="scene">🏘🏮🌙</div>
  <div id="news"></div>
  <div id="next"><span id="compass">▲</span><span id="nextT"></span></div>
  <div id="place"></div>
  <div id="stick"></div><div id="stickBase"></div><div id="stickKnob"></div>
  <button id="act"></button>
  <button id="call">📣 売り声</button>
  <button id="netB" onclick="roomSheet()" aria-label="みんなで あそぶ">👥</button>
  <div id="keyHint">W・↑ すすむ／A・D まがる／S・↓ さがる／E 入る・話す／Q 売り声（夜）</div>
  <div id="cmd">
    <button id="bHouse" onclick="houseSheet()">🏠 家</button>
    <button id="bBoard" onclick="boardSheet()">📋 回覧板</button>
    <button id="bWork" onclick="workGo()">🌙 仕事に 行く</button>
    <button id="bEat" onclick="eatSheet()">🍚 食べる</button>
    <button id="bJii" onclick="jiiSheet()" style="grid-column: span 2">👴 物知りな じいさん</button>
  </div>
</div>

<div id="work" class="screen">
  <h2>🍱 ウナギ屋：うなぎに タレを かける</h2>
  <p class="hint" id="wHint">ゆび（マウス）で うなぎを なぞって、タレを ぬろう</p>
  <canvas id="cv"></canvas>
  <div id="bar"><div id="barIn"></div></div>
  <div id="wMsg"></div>
</div>

<div id="sheet"><div id="sheetBox"></div></div>
<div id="stickHint"><span>ここを おして<br>ゆびを うごかす</span></div>
<div id="ver"></div>

<script src="../common/net.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const URLQ = new URLSearchParams(location.search);
const DEV = URLQ.get('dev') === '1';
const BUILD = 'edo-1126c';   // ⚠ 版の印
// 🎨 見た目：パパ 11/23「2の漆」で 決まり（?ui=1／3 は 比べる 用に 残す）
const UI = ['1', '2', '3'].includes(URLQ.get('ui')) ? URLQ.get('ui') : '2';
document.body.classList.add('ui' + UI); window.edoUI = UI;
$('ver').textContent = BUILD;

// ============ ゲームログ（群雄合戦と 同じ しくみ・常時ON。テストプレイは 全部 データ） ============
const LOG_TAG = URLQ.get('tag') || 'edo';
const STARTED = new Date().toISOString();
const LOG_KEY = 'yuujinGameLog_' + STARTED.replace(/[:.]/g, '-') + '_' + LOG_TAG;
const gameLog = [];
function logEvent(type, data) { gameLog.push({ t: Math.round(performance.now()), type, data }); }
function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify({ ver: location.pathname, tag: LOG_TAG, build: BUILD, started: STARTED, events: gameLog.slice(-3000) })); }
  catch (e) { console.warn('⚠ ログを保存できなかった', e); }
}
window.gameLogPeek = () => gameLog;
setInterval(saveLog, 10000);
addEventListener('beforeunload', saveLog);
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyMDP1lVKD7YRe3A0Z37qr9W6fMOcIyPiy-c_d2kZs1ywQCeeBrwLz7sm6-5tKqYomX/exec';
const CLOUD_KEY = 'yuujin2026';
try { if (!localStorage.getItem('yuujinDevice')) localStorage.setItem('yuujinDevice', 'pc-' + Math.random().toString(36).slice(2, 7)); } catch (e) {}
let DEVICE = 'unknown'; try { DEVICE = localStorage.getItem('yuujinDevice') || 'unknown'; } catch (e) {}
let sentCount = 0, sending = false;

// ============ ウナギ屋の 仕事（監督11/5「ウナギや屋は、うなぎにたれおかけるだけ」「垂れは、よるになったらいく」「仕事をミニゲームにしたらどう」） ============
let W = null;
const cv = $('cv'), cx = cv.getContext('2d');
function workGo() {
  if (!S.job) return;
  const w = Math.min(innerWidth - 24, 420), h = 220;
  cv.width = w; cv.height = h;
  W = { i: 0, earned: 0, eel: { x: w * .12, y: h * .36, w: w * .76, h: h * .3 }, busy: false };
  logEvent('work_start', { day: S.day, mon: S.mon, hungry: S.hungry });
  show('work'); bowlStart();
}
function bowlStart() {
  W.cells = new Uint8Array(UN.cols * UN.rows); W.n = 0; W.busy = false; W.strokes = 0; W.first = null; W.per = [];
  W.limit = Math.max(UN.tMin, UN.t0 - UN.tStep * W.i); W.t0 = performance.now();
  $('wMsg').textContent = `${W.i + 1}ぱい目（${UN.bowls}ぱい中）`;
  drawBowl(); clearInterval(W.timer);
  W.timer = setInterval(() => { const e = performance.now() - W.t0; $('barIn').style.width = Math.max(0, 100 - e / W.limit * 100) + '%';
    if (e >= W.limit) bowlEnd(); }, 50);
}
function drawBowl() {
  const { x, y, w, h } = W.eel, cw = w / UN.cols, ch = h / UN.rows;
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.fillStyle = '#1b1b1b'; cx.beginPath(); cx.ellipse(cv.width / 2, cv.height / 2, cv.width * .47, cv.height * .42, 0, 0, 7); cx.fill();   // どんぶり
  cx.fillStyle = '#f5f1e6'; cx.beginPath(); cx.ellipse(cv.width / 2, cv.height / 2, cv.width * .43, cv.height * .36, 0, 0, 7); cx.fill();   // ごはん
  for (let r = 0; r < UN.rows; r++) for (let c = 0; c < UN.cols; c++) {
    cx.fillStyle = W.cells[r * UN.cols + c] ? '#5b2a0c' : '#d9a066';                                                                        // タレ／まだ
    cx.fillRect(x + c * cw, y + r * ch, cw + .5, ch + .5);
  }
  cx.strokeStyle = '#3a1a06'; cx.lineWidth = 2; cx.strokeRect(x, y, w, h);
}
function paint(e) {
  if (!W || W.busy) return;
  const rc = cv.getBoundingClientRect(), px = (e.clientX - rc.left) * cv.width / rc.width, py = (e.clientY - rc.top) * cv.height / rc.height;
  const { x, y, w, h } = W.eel, cw = w / UN.cols, ch = h / UN.rows, rad = ch * UN.brush;
  for (let r = 0; r < UN.rows; r++) for (let c = 0; c < UN.cols; c++) {
    const i = r * UN.cols + c; if (W.cells[i]) continue;
    if (Math.hypot(x + (c + .5) * cw - px, y + (r + .5) * ch - py) <= rad) { W.cells[i] = 1; W.n++; }
  }
  drawBowl();
  if (W.n && W.first === null) W.first = Math.round(performance.now() - W.t0);   // 指を 下ろした まま 次の どんぶりに 入った ときも 残す
  if (W.n >= W.cells.length * UN.done) bowlEnd();
}
let down = false;
cv.addEventListener('pointerdown', e => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (err) {} if (W && !W.busy) { W.strokes++; if (W.first === null) W.first = Math.round(performance.now() - W.t0); W.per.push(W.n); } paint(e); });
cv.addEventListener('pointermove', e => { if (down) paint(e); });
addEventListener('pointerup', () => { down = false; });
addEventListener('pointercancel', () => { down = false; });
function bowlEnd() {
  if (W.busy) return; W.busy = true; clearInterval(W.timer);
  const cov = W.n / W.cells.length, ok = cov >= UN.need, ms = Math.round(performance.now() - W.t0);
  if (ok) W.earned += UN.pay;
  S.bowls++;
  // first＝さいしょに さわるまでの ms・per＝なぞり 1本ごとに ぬれた マスの 数（持ち時間と 筆の 太さを ログから 直すため）
  const per = W.per.map((v, k) => (k + 1 < W.per.length ? W.per[k + 1] : W.n) - v);
  logEvent('bowl', { i: W.i, cov: +cov.toFixed(2), ms, limit: W.limit, ok, strokes: W.strokes, first: W.first, per: per.slice(0, 30) });
  $('wMsg').textContent = ok ? (cov >= UN.done ? '◎ きれいに ぬれた！ +1文' : '○ よし！ +1文') : '× タレが たりない…';

}
function workEnd() {
  const e = W.earned; W = null;
  S.mon += e + PAY_PLUS; S.day++; S.hungry++;
  logEvent('work_end', { earned: e, plus: PAY_PLUS, mon: S.mon, day: S.day, hungry: S.hungry });
  show('town');
  news(`🌙 ウナギ屋で ${UN.bowls}ぱい 作った。うまく できた ぶん ${e}文 ＋ 給料 ${PAY_PLUS}文 ＝ ${e + PAY_PLUS}文 もらった。朝に なった（${S.day}日目）。`, e ? 'good' : 'bad');

}

function over(title, body, type) {

// ponytail: 数字は 仮・客は 出てこない（知らせだけ）, テストプレイの ログ（soba_call・soba_end）を 見て 直す
